<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Versant Assessment Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .audio-wave { display: flex; align-items: center; gap: 3px; }
        .audio-wave span {
            display: block; width: 3px; height: 10px; background-color: #ef4444;
            border-radius: 3px; animation: wave 1s ease-in-out infinite;
        }
        .audio-wave span:nth-child(2) { animation-delay: 0.1s; }
        .audio-wave span:nth-child(3) { animation-delay: 0.2s; }
        .audio-wave span:nth-child(4) { animation-delay: 0.3s; }
        @keyframes wave {
            0%, 100% { height: 10px; }
            50% { height: 24px; }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen py-10 px-4 sm:px-6">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // 1. DYNAMIC READING PASSAGES
        const READING_PASSAGES = [
            "Welcome to the customer support line. Our technical team is available twenty-four hours a day to diagnose and resolve your internet issues.\nPlease check that the main power adapter is tightly connected to your wireless modem.\nVerify that the network signal light remains solid green and is not blinking red or amber.",
            "Customer service requires active listening and empathy to resolve issues effectively. When a customer calls with a complaint, it is important to remain calm.\nAlways apologize for the inconvenience and assure them that you will find a solution.\nFollowing up after the call ensures long-term customer satisfaction and loyalty.",
            "Effective time management allows individuals to achieve greater productivity and reduce workplace stress.\nStart your day by prioritizing tasks and creating a structured to-do list.\nAvoid multitasking as it can lead to errors and decrease overall focus.\nTaking short breaks between tasks helps maintain high energy levels."
        ];

        // 2. MCQ QUESTIONS WITH 3 OPTIONS
        const MASTER_QUESTION_POOL = [
            { q: "Which is faster: a bicycle or a jet plane?", options: ["A bicycle", "A jet plane", "A car"], correctIndex: 1, expected: "A jet plane" },
            { q: "To keep ice cream cold, should you put it in the oven or the freezer?", options: ["The oven", "The freezer", "The microwave"], correctIndex: 1, expected: "The freezer" },
            { q: "If a shirt is too big, is it tight or loose?", options: ["Tight", "Loose", "Perfect"], correctIndex: 1, expected: "Loose" },
            { q: "Which is heavier: a pillow or a brick?", options: ["A pillow", "A brick", "A feather"], correctIndex: 1, expected: "A brick" },
            { q: "Does a standard traffic light use red or blue to tell drivers to stop?", options: ["Red", "Blue", "Green"], correctIndex: 0, expected: "Red" },
            { q: "If you want to cut a piece of paper, would you use scissors or a pen?", options: ["A pen", "A ruler", "Scissors"], correctIndex: 2, expected: "Scissors" },
            { q: "What is the opposite of the word 'heavy'?", options: ["Light", "Big", "Strong"], correctIndex: 0, expected: "Light" },
            { q: "If you are not awake, what are you?", options: ["Running", "Asleep", "Eating"], correctIndex: 1, expected: "Asleep" },
            { q: "Is your father's sister your aunt or your uncle?", options: ["Aunt", "Uncle", "Cousin"], correctIndex: 0, expected: "Aunt" },
            { q: "What do we call a person who treats sick animals?", options: ["Doctor", "Dentist", "Veterinarian"], correctIndex: 2, expected: "Veterinarian" }
        ];

        function getRandomItems(pool, count = 5) {
            const arr = [...pool];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr.slice(0, count);
        }

        function App() {
            const [agentName, setAgentName] = useState("");
            const [agentId, setAgentId] = useState("");
            const [step, setStep] = useState(0); 

            const [currentPassage, setCurrentPassage] = useState("");
            const [assignedQuestions, setAssignedQuestions] = useState([]);
            const [currentQIndex, setCurrentQIndex] = useState(0);
            const [selectedOptions, setSelectedOptions] = useState(new Array(5).fill(null));

            const [isRecording, setIsRecording] = useState(false);
            const [readingTranscript, setReadingTranscript] = useState("");
            const [readingAudioURL, setReadingAudioURL] = useState(null);

            const [qaTranscripts, setQaTranscripts] = useState([]);
            const [qaAudioURLs, setQaAudioURLs] = useState([]);
            const [hasRecordedCurrent, setHasRecordedCurrent] = useState(false);

            const [result, setResult] = useState(null);
            const [isEvaluating, setIsEvaluating] = useState(false);

            const mediaRecorder = useRef(null);
            const audioChunks = useRef([]);
            const recognition = useRef(null);

            useEffect(() => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognition) {
                    recognition.current = new SpeechRecognition();
                    recognition.current.continuous = true;
                    recognition.current.interimResults = true;

                    recognition.current.onresult = (event) => {
                        let text = '';
                        for (let i = event.resultIndex; i < event.results.length; ++i) {
                            if (event.results[i].isFinal) {
                                text += event.results[i][0].transcript + ' ';
                            }
                        }
                        if (step === 1) {
                            setReadingTranscript(prev => prev + text);
                        } else if (step === 2) {
                            setQaTranscripts(prev => {
                                const next = [...prev];
                                next[currentQIndex] = (next[currentQIndex] || "") + text;
                                return next;
                            });
                        }
                    };
                }
            }, [step, currentQIndex]);

            const handleStartTest = () => {
                if (!agentName.trim()) {
                    alert("Kripya candidate ka naam enter karein.");
                    return;
                }
                // Random Subject/Passage
                setCurrentPassage(READING_PASSAGES[Math.floor(Math.random() * READING_PASSAGES.length)]);
                setAssignedQuestions(getRandomItems(MASTER_QUESTION_POOL, 5));
                setQaTranscripts(new Array(5).fill(""));
                setQaAudioURLs(new Array(5).fill(null));
                setSelectedOptions(new Array(5).fill(null));
                setCurrentQIndex(0);
                setReadingTranscript("");
                setReadingAudioURL(null);
                setHasRecordedCurrent(false);
                setStep(1);
            };

            const startRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder.current = new MediaRecorder(stream);
                    audioChunks.current = [];

                    mediaRecorder.current.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunks.current.push(e.data);
                    };

                    mediaRecorder.current.onstop = () => {
                        const audioBlob = new Blob(audioChunks.current, { type: 'audio/webm' });
                        const audioUrl = URL.createObjectURL(audioBlob);
                        if (step === 1) {
                            setReadingAudioURL(audioUrl);
                        } else if (step === 2) {
                            setQaAudioURLs(prev => {
                                const copy = [...prev];
                                copy[currentQIndex] = audioUrl;
                                return copy;
                            });
                        }
                    };

                    mediaRecorder.current.start();
                    if (recognition.current) {
                        try { recognition.current.start(); } catch (err) {}
                    }
                    setIsRecording(true);
                } catch (err) {
                    alert("Microphone permission denied! Kripya browser me microphone allow karein.");
                }
            };

            const stopRecording = () => {
                if (mediaRecorder.current && mediaRecorder.current.state !== "inactive") {
                    mediaRecorder.current.stop();
                }
                if (recognition.current) {
                    try { recognition.current.stop(); } catch (e) {}
                }
                setIsRecording(false);
                setHasRecordedCurrent(true);
            };

            const handleOptionChange = (index) => {
                const newSelected = [...selectedOptions];
                newSelected[currentQIndex] = index;
                setSelectedOptions(newSelected);
            };

            const calculateEvaluation = () => {
                setIsEvaluating(true);
                setTimeout(() => {
                    // 1. Reading passage analysis
                    const expectedWordsRaw = currentPassage.toLowerCase().replace(/[^a-zA-Z0-9\s]/g, '').split(/\s+/).filter(Boolean);
                    const spokenWords = readingTranscript.toLowerCase().replace(/[^a-zA-Z0-9\s]/g, '').split(/\s+/).filter(Boolean);
                    const spokenWordSet = new Set(spokenWords);

                    let matchedCount = 0;
                    const missedWordsList = [];

                    expectedWordsRaw.forEach(word => {
                        if (spokenWordSet.has(word)) {
                            matchedCount++;
                        } else {
                            if (word.length > 2 && !missedWordsList.includes(word)) {
                                missedWordsList.push(word);
                            }
                        }
                    });

                    const readingAccuracy = expectedWordsRaw.length > 0 ? Math.round((matchedCount / expectedWordsRaw.length) * 100) : 0;
                    const pronunciation = Math.min(96, Math.max(30, Math.round(readingAccuracy * 0.85 + 10)));
                    const fluency = Math.min(95, Math.max(25, Math.round(readingAccuracy * 0.75 + (spokenWords.length > 12 ? 20 : 5))));

                    // 2. MCQ Logic evaluation
                    let correctCount = 0;
                    const failedQuestionsList = [];
                    const breakdown = assignedQuestions.map((item, idx) => {
                        const rawAns = (qaTranscripts[idx] || "").toLowerCase().trim();
                        const isMatch = selectedOptions[idx] === item.correctIndex; // Checking selected MCQ option
                        
                        if (isMatch) {
                            correctCount++;
                        } else {
                            failedQuestionsList.push({
                                qNum: idx + 1,
                                question: item.q,
                                agentSaid: selectedOptions[idx] !== null ? item.options[selectedOptions[idx]] : "Not Selected",
                                expected: item.expected
                            });
                        }
                        return {
                            question: item.q,
                            candidateAnswer: selectedOptions[idx] !== null ? item.options[selectedOptions[idx]] : "Not Selected",
                            transcript: rawAns,
                            isCorrect: isMatch,
                            expected: item.expected,
                            audio: qaAudioURLs[idx]
                        };
                    });

                    const logicScore = Math.round((correctCount / 5) * 100);
                    const vocabulary = Math.min(98, Math.max(35, Math.round(logicScore * 0.65 + readingAccuracy * 0.35)));
                    const overallScore = Math.round((pronunciation * 0.3) + (fluency * 0.25) + (logicScore * 0.3) + (vocabulary * 0.15));

                    let level = "V1 (Pre-Elementary)";
                    if (overallScore >= 85) level = "V6 (Native Mastery)";
                    else if (overallScore >= 75) level = "V5 (Advanced Business)";
                    else if (overallScore >= 65) level = "V4 (Proficient)";
                    else if (overallScore >= 55) level = "V3 (Intermediate)";
                    else if (overallScore >= 45) level = "V2 (Basic)";

                    const isPassed = overallScore >= 60 && correctCount >= 3 && readingAccuracy >= 50;
                    
                    // Detailed Mistake Audit & AOI
                    const detailedMistakes = [];
                    let aoiList = [];

                    if (correctCount < 3) {
                        detailedMistakes.push({
                            title: `MCQ Failure (${correctCount}/5 Correct)`,
                            desc: `Agent ne context base MCQ questions ke galat options select kiye. Min 3 correct required the.`
                        });
                        aoiList.push("Improve listening comprehension and cognitive logic to select correct MCQ options.");
                    }
                    if (readingAccuracy < 60) {
                        detailedMistakes.push({
                            title: `Pronunciation & Missed Words (${readingAccuracy}% Match)`,
                            desc: `Passage me ${missedWordsList.length} words miss ya mispronounce hue.`
                        });
                        aoiList.push("Focus on clear pronunciation and avoid skipping words while reading aloud.");
                    }
                    if (fluency < 55) {
                        detailedMistakes.push({
                            title: "Fluency & Speech Rhythm Low",
                            desc: "Recording ke waqt aawaz me hesitation aur pauses detect hue."
                        });
                        aoiList.push("Practice smooth reading without unnecessary stops or long pauses.");
                    }
                    if (aoiList.length === 0 && !isPassed) {
                        aoiList.push("General overall communication skills need slight improvement to meet the 60% benchmark.");
                    }
                    if(isPassed) {
                        aoiList.push("Maintain current accuracy, logical thinking, and voice clarity.");
                    }

                    setResult({
                        isPassed, overallScore, level, pronunciation, fluency, logicScore, vocabulary,
                        readingAccuracy, correctCount, missedWordsList, failedQuestionsList,
                        detailedMistakes, breakdown, aoiList,
                        timestamp: new Date().toLocaleString()
                    });

                    setStep(3);
                    setIsEvaluating(false);
                }, 800);
            };

            const renderHighlightedPassage = () => {
                const tokens = currentPassage.split(/(\s+)/);
                const spokenWordsList = readingTranscript.toLowerCase().replace(/[^a-z0-9\s]/g, '').split(/\s+/).filter(Boolean);

                return tokens.map((token, idx) => {
                    if (!token.trim()) return <span key={idx}>{token}</span>;
                    const cleanToken = token.toLowerCase().replace(/[^a-z0-9]/g, '');
                    const isMatched = spokenWordsList.includes(cleanToken);

                    let classes = "transition-all duration-300 ";
                    if (isMatched) {
                        classes += "text-emerald-700 font-bold bg-emerald-50 rounded px-1";
                    } else if (!isRecording && hasRecordedCurrent) {
                        classes += "text-rose-600 font-bold underline decoration-rose-400 underline-offset-4 bg-rose-50 rounded px-1";
                    } else if (isRecording) {
                        classes += "text-slate-400";
                    } else {
                        classes += "text-slate-800";
                    }

                    return <span key={idx} className={classes}>{token}</span>;
                });
            };

            const ProgressBar = ({ label, value, colorClass }) => (
                <div className="mb-3.5">
                    <div className="flex justify-between text-xs mb-1.5 font-semibold">
                        <span className="text-slate-600 uppercase tracking-wide">{label}</span>
                        <span className="text-slate-800">{value}%</span>
                    </div>
                    <div className="w-full bg-slate-200/70 rounded-full h-2.5">
                        <div className={`h-2.5 rounded-full ${colorClass} transition-all duration-500`} style={{ width: `${value}%` }}></div>
                    </div>
                </div>
            );

            return (
                <div className="max-w-4xl mx-auto">
                    {/* Top Bar */}
                    <div className="bg-white border border-slate-200 rounded-2xl shadow-sm p-6 mb-6 flex items-center justify-between">
                        <div className="flex items-center gap-3">
                            <div className="w-12 h-12 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-black text-2xl shadow-lg shadow-indigo-500/25">V</div>
                            <div>
                                <h1 className="text-xl font-extrabold text-slate-900 tracking-tight">AI Versant Diagnostic Portal</h1>
                                <p className="text-xs font-semibold text-slate-500">Automated Voice & Error Analysis Engine</p>
                            </div>
                        </div>
                        {isRecording && (
                            <div className="flex items-center gap-2 px-3 py-1.5 bg-rose-50 border border-rose-200 rounded-full text-rose-600 text-xs font-bold">
                                <div className="audio-wave"><span></span><span></span><span></span><span></span></div>
                                MIC ACTIVE
                            </div>
                        )}
                    </div>

                    {/* Step 0: Onboarding */}
                    {step === 0 && (
                        <div className="bg-white border border-slate-200 rounded-2xl shadow-sm p-8 sm:p-10">
                            <h2 className="text-2xl font-bold text-slate-900 mb-2">Candidate Verification</h2>
                            <p className="text-slate-500 text-sm mb-8 font-medium">Candidate ka naam enter karein. Har candidate ko naya random reading passage aur questions milenge.</p>
                            <div className="space-y-4 max-w-md mb-8">
                                <div>
                                    <label className="block text-sm font-bold text-slate-700 mb-2">Candidate Full Name *</label>
                                    <input type="text" value={agentName} onChange={(e) => setAgentName(e.target.value)} placeholder="e.g. Priyanshu Verma" className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-600 focus:border-indigo-600 outline-none transition font-medium"/>
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-slate-700 mb-2">Agent ID (Optional)</label>
                                    <input type="text" value={agentId} onChange={(e) => setAgentId(e.target.value)} placeholder="e.g. AGT-209" className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-600 focus:border-indigo-600 outline-none transition font-medium"/>
                                </div>
                            </div>
                            <button onClick={handleStartTest} className="px-8 py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition shadow-lg shadow-indigo-600/25">Start Assessment →</button>
                        </div>
                    )}

                    {/* Step 1: Reading Test */}
                    {step === 1 && (
                        <div className="bg-white border border-slate-200 rounded-2xl shadow-sm p-8">
                            <div className="flex justify-between items-center mb-6 pb-4 border-b border-slate-100">
                                <div>
                                    <span className="text-xs font-extrabold text-indigo-600 uppercase tracking-wider">Part 1 of 2</span>
                                    <h2 className="text-2xl font-bold text-slate-900 mt-1">Reading Fluency Assessment</h2>
                                </div>
                                <span className="text-xs font-bold text-slate-500 bg-slate-100 px-3 py-1 rounded-full">Candidate: {agentName}</span>
                            </div>

                            <div className="bg-slate-50 border border-slate-200 rounded-xl p-6 text-lg leading-relaxed whitespace-pre-line mb-6 font-medium">
                                {renderHighlightedPassage()}
                            </div>

                            <div className="flex items-center gap-4 pt-4 border-t border-slate-100">
                                {!isRecording && !hasRecordedCurrent && (
                                    <button onClick={startRecording} className="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition shadow-md">🎙️ Start Reading</button>
                                )}
                                {isRecording && (
                                    <button onClick={stopRecording} className="px-6 py-3 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl transition shadow-md">■ Stop Reading</button>
                                )}
                                {!isRecording && hasRecordedCurrent && (
                                    <button onClick={() => { setStep(2); setHasRecordedCurrent(false); }} className="px-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition shadow-md">Proceed to Logic Test →</button>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Step 2: MCQ Options + Recording */}
                    {step === 2 && assignedQuestions.length > 0 && (
                        <div className="bg-white border border-slate-200 rounded-2xl shadow-sm p-8">
                            <div className="flex justify-between items-center mb-6 pb-4 border-b border-slate-100">
                                <div>
                                    <span className="text-xs font-extrabold text-indigo-600 uppercase tracking-wider">Part 2 of 2</span>
                                    <h2 className="text-2xl font-bold text-slate-900 mt-1">Logic MCQ & Audio Test</h2>
                                </div>
                                <span className="text-sm font-bold bg-slate-100 text-slate-700 px-3 py-1 rounded-lg">Question {currentQIndex + 1} / 5</span>
                            </div>

                            <div className="bg-slate-50 border border-slate-200 rounded-xl p-6 mb-6">
                                <p className="text-2xl font-bold text-slate-900 mb-4">{assignedQuestions[currentQIndex].q}</p>
                                
                                <div className="space-y-3">
                                    {assignedQuestions[currentQIndex].options.map((opt, i) => (
                                        <label key={i} className={`flex items-center gap-3 p-3 rounded-lg border cursor-pointer transition ${selectedOptions[currentQIndex] === i ? 'bg-indigo-50 border-indigo-500' : 'bg-white border-slate-300 hover:bg-slate-50'}`}>
                                            <input type="radio" name={`mcq-${currentQIndex}`} checked={selectedOptions[currentQIndex] === i} onChange={() => handleOptionChange(i)} className="w-5 h-5 text-indigo-600"/>
                                            <span className="text-lg font-medium text-slate-800">{opt}</span>
                                        </label>
                                    ))}
                                </div>
                            </div>

                            <div className="bg-indigo-50/50 border border-indigo-100 p-4 rounded-xl text-sm text-indigo-900 font-medium mb-6">
                                📌 <strong>Rule:</strong> Pehle correct option select karein, fir Record button dabakar apna answer mic par bolen.
                            </div>

                            <div className="flex items-center gap-4 pt-4 border-t border-slate-100">
                                {!isRecording && !hasRecordedCurrent && (
                                    <button onClick={startRecording} disabled={selectedOptions[currentQIndex] === null} className={`px-6 py-3 font-bold rounded-xl transition shadow-md ${selectedOptions[currentQIndex] === null ? 'bg-slate-300 text-slate-500 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-700 text-white'}`}>🎙️ Record Answer</button>
                                )}
                                {isRecording && (
                                    <button onClick={stopRecording} className="px-6 py-3 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl transition shadow-md">■ Stop Recording</button>
                                )}
                                {!isRecording && hasRecordedCurrent && currentQIndex < 4 && (
                                    <button onClick={() => { setCurrentQIndex(prev => prev + 1); setHasRecordedCurrent(false); }} className="px-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition shadow-md">Next Question →</button>
                                )}
                                {!isRecording && hasRecordedCurrent && currentQIndex === 4 && (
                                    <button onClick={calculateEvaluation} className="px-8 py-3 bg-slate-900 hover:bg-black text-white font-bold rounded-xl transition shadow-md">
                                        {isEvaluating ? "Analyzing..." : "Submit Test"}
                                    </button>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Step 3: Result Dashboard (AOI & Failure Reason) */}
                    {step === 3 && result && (
                        <div className="space-y-6">
                            <div className="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
                                <div className={`px-8 py-6 flex justify-between items-center ${result.isPassed ? "bg-emerald-600" : "bg-rose-600"} text-white`}>
                                    <div>
                                        <h2 className="text-3xl font-black">{agentName}</h2>
                                        <p className="text-sm font-medium opacity-90 mt-1">{result.timestamp} • {agentId}</p>
                                    </div>
                                    <div className="text-right">
                                        <div className="text-4xl font-black">{result.overallScore}<span className="text-xl opacity-80">/100</span></div>
                                        <span className="inline-block mt-2 px-3 py-1 bg-white/20 rounded-full text-xs font-bold uppercase tracking-wider">{result.isPassed ? "PASSED" : "FAILED"}</span>
                                    </div>
                                </div>

                                <div className="p-8 grid grid-cols-1 md:grid-cols-2 gap-8">
                                    <div>
                                        <h3 className="text-lg font-bold mb-4">Competency Scores</h3>
                                        <ProgressBar label="Pronunciation" value={result.pronunciation} colorClass="bg-indigo-600" />
                                        <ProgressBar label="Fluency & Speed" value={result.fluency} colorClass="bg-blue-600" />
                                        <ProgressBar label="MCQ Logic" value={result.logicScore} colorClass="bg-emerald-600" />
                                        <ProgressBar label="Vocabulary" value={result.vocabulary} colorClass="bg-amber-600" />
                                    </div>

                                    <div>
                                        {/* Areas of Improvement (AOI) */}
                                        <h3 className="text-lg font-bold text-slate-900 mb-4">Areas of Improvement (AOI)</h3>
                                        <ul className="list-disc pl-5 text-sm font-medium text-slate-700 space-y-2 mb-6">
                                            {result.aoiList.map((aoi, i) => (
                                                <li key={i}>{aoi}</li>
                                            ))}
                                        </ul>

                                        {result.isPassed ? (
                                            <div className="p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-900 text-sm font-medium">✅ <strong>Candidate Qualified.</strong> All benchmarks met.</div>
                                        ) : (
                                            <div className="p-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-900 text-sm font-medium">⚠️ <strong>Candidate Disqualified.</strong> Please review the Mistake Audit below.</div>
                                        )}
                                        <button onClick={() => window.location.reload()} className="w-full mt-4 py-3 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl text-sm transition">↻ Conduct New Test</button>
                                    </div>
                                </div>
                            </div>

                            {/* EXACT MISTAKE AUDIT CARD */}
                            {!result.isPassed && (
                                <div className="bg-white border-2 border-rose-200 rounded-2xl shadow-sm p-6 sm:p-8">
                                    <div className="flex items-center gap-2 mb-4 pb-3 border-b border-rose-100">
                                        <span className="w-8 h-8 rounded-lg bg-rose-100 text-rose-600 flex items-center justify-center font-bold text-lg">⚠️</span>
                                        <div>
                                            <h3 className="text-lg font-bold text-slate-900">Failed Reason (Galti Kahan Hui Thi)</h3>
                                            <p className="text-xs text-slate-500">Mukhya kaaran kyu agent fail hua:</p>
                                        </div>
                                    </div>
                                    <div className="space-y-3 mb-6">
                                        {result.detailedMistakes.map((item, idx) => (
                                            <div key={idx} className="p-4 rounded-xl bg-rose-50 border border-rose-200">
                                                <p className="text-sm font-bold text-rose-900">{idx + 1}. {item.title}</p>
                                                <p className="text-xs text-rose-700 mt-1 font-medium">{item.desc}</p>
                                            </div>
                                        ))}
                                    </div>
                                    
                                    {/* MCQ Failed Data */}
                                    {result.failedQuestionsList.length > 0 && (
                                        <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 mt-4">
                                            <p className="text-xs font-bold uppercase text-slate-600 mb-3">Galat MCQ Options Select Kiye Gaye:</p>
                                            <div className="space-y-3">
                                                {result.failedQuestionsList.map((item, fIdx) => (
                                                    <div key={fIdx} className="p-3 bg-white rounded-lg border border-slate-200 text-xs">
                                                        <p className="font-bold text-slate-800">Q{item.qNum}: {item.question}</p>
                                                        <div className="mt-2 grid grid-cols-1 sm:grid-cols-2 gap-2">
                                                            <div className="text-rose-700 font-medium">Selected: "{item.agentSaid}"</div>
                                                            <div className="text-emerald-700 font-medium">Expected: {item.expected}</div>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
