<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Versant Assessment Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .audio-wave { display: flex; align-items: center; gap: 3px; }
        .audio-wave span {
            display: block; width: 3px; height: 10px; background-color: #ef4444;
            border-radius: 3px; animation: wave 1s ease-in-out infinite;
        }
        .audio-wave span:nth-child(2) { animation-delay: 0.1s; }
        .audio-wave span:nth-child(3) { animation-delay: 0.2s; }
        .audio-wave span:nth-child(4) { animation-delay: 0.3s; }
        @keyframes wave { 0%, 100% { height: 10px; } 50% { height: 24px; } }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen py-10 px-4 sm:px-6">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const READING_PASSAGES = [
            "Welcome to the customer support line. Our technical team is available twenty-four hours a day to diagnose and resolve your internet issues.\nPlease check that the main power adapter is tightly connected to your wireless modem.\nVerify that the network signal light remains solid green and is not blinking red or amber.",
            "Customer service requires active listening and empathy to resolve issues effectively. When a customer calls with a complaint, it is important to remain calm.\nAlways apologize for the inconvenience and assure them that you will find a solution.\nFollowing up after the call ensures long-term customer satisfaction and loyalty.",
            "Effective time management allows individuals to achieve greater productivity and reduce workplace stress.\nStart your day by prioritizing tasks and creating a structured to-do list.\nAvoid multitasking as it can lead to errors and decrease overall focus.\nTaking short breaks between tasks helps maintain high energy levels."
        ];

        const MASTER_QUESTION_POOL = [
            { q: "Which is faster: a bicycle or a jet plane?", options: ["A bicycle", "A jet plane", "A car"], correctIndex: 1, expected: "A jet plane" },
            { q: "To keep ice cream cold, should you put it in the oven or the freezer?", options: ["The oven", "The freezer", "The microwave"], correctIndex: 1, expected: "The freezer" },
            { q: "If a shirt is too big, is it tight or loose?", options: ["Tight", "Loose", "Perfect"], correctIndex: 1, expected: "Loose" },
            { q: "Which is heavier: a pillow or a brick?", options: ["A pillow", "A brick", "A feather"], correctIndex: 1, expected: "A brick" },
            { q: "Does a standard traffic light use red or blue to tell drivers to stop?", options: ["Red", "Blue", "Green"], correctIndex: 0, expected: "Red" },
            { q: "If you want to cut a piece of paper, would you use scissors or a pen?", options: ["A pen", "A ruler", "Scissors"], correctIndex: 2, expected: "Scissors" },
            { q: "What is the opposite of the word 'heavy'?", options: ["Light", "Big", "Strong"], correctIndex: 0, expected: "Light" },
            { q: "If you are not awake, what are you?", options: ["Running", "Asleep", "Eating"], correctIndex: 1, expected: "Asleep" },
            { q: "Is your father's sister your aunt or your uncle?", options: ["Aunt", "Uncle", "Cousin"], correctIndex: 0, expected: "Aunt" }
        ];

        function getRandomItems(pool, count = 5) {
            const arr = [...pool];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr.slice(0, count);
        }

        function App() {
            const [agentName, setAgentName] = useState("");
            const [agentId, setAgentId] = useState("");
            const [step, setStep] = useState(0); 

            const [currentPassage, setCurrentPassage] = useState("");
            const [assignedQuestions, setAssignedQuestions] = useState([]);
            const [currentQIndex, setCurrentQIndex] = useState(0);
            const [selectedOptions, setSelectedOptions] = useState(new Array(5).fill(null));

            const [isRecording, setIsRecording] = useState(false);
            const [readingTranscript, setReadingTranscript] = useState("");
            const [readingAudioURL, setReadingAudioURL] = useState(null);
            const [hasRecordedCurrent, setHasRecordedCurrent] = useState(false);

            const [result, setResult] = useState(null);
            const [isEvaluating, setIsEvaluating] = useState(false);

            const mediaRecorder = useRef(null);
            const audioChunks = useRef([]);
            const recognition = useRef(null);
            
            const recordingStartTimeRef = useRef(null);
            const recordingDurationRef = useRef(0);

            useEffect(() => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognition) {
                    recognition.current = new SpeechRecognition();
                    recognition.current.continuous = true;
                    recognition.current.interimResults = true;
                    recognition.current.lang = 'en-US';

                    recognition.current.onresult = (event) => {
                        let text = '';
                        for (let i = event.resultIndex; i < event.results.length; ++i) {
                            if (event.results[i].isFinal) {
                                text += event.results[i][0].transcript + ' ';
                            }
                        }
                        if (step === 1) {
                            setReadingTranscript(prev => prev + text);
                        }
                    };
                }
            }, [step]);

            const handleStartTest = () => {
                if (!agentName.trim()) {
                    alert("Kripya candidate ka naam enter karein.");
                    return;
                }
                setCurrentPassage(READING_PASSAGES[Math.floor(Math.random() * READING_PASSAGES.length)]);
                setAssignedQuestions(getRandomItems(MASTER_QUESTION_POOL, 5));
                setSelectedOptions(new Array(5).fill(null));
                setCurrentQIndex(0);
                setReadingTranscript("");
                setReadingAudioURL(null);
                setHasRecordedCurrent(false);
                setStep(1);
            };

            const startRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder.current = new MediaRecorder(stream);
                    audioChunks.current = [];

                    mediaRecorder.current.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunks.current.push(e.data);
                    };

                    mediaRecorder.current.onstop = () => {
                        const audioBlob = new Blob(audioChunks.current, { type: 'audio/webm' });
                        const audioUrl = URL.createObjectURL(audioBlob);
                        if (step === 1) {
                            setReadingAudioURL(audioUrl);
                        }
                    };

                    mediaRecorder.current.start();
                    if (recognition.current) {
                        try { recognition.current.start(); } catch (err) {}
                    }
                    recordingStartTimeRef.current = Date.now();
                    setIsRecording(true);
                } catch (err) {
                    alert("Microphone permission denied! Kripya browser me allow karein.");
                }
            };

            const stopRecording = () => {
                if (mediaRecorder.current && mediaRecorder.current.state !== "inactive") {
                    mediaRecorder.current.stop();
                }
                if (recognition.current) {
                    try { recognition.current.stop(); } catch (e) {}
                }
                recordingDurationRef.current = (Date.now() - recordingStartTimeRef.current) / 1000; 
                setIsRecording(false);
                setHasRecordedCurrent(true);
            };

            const handleOptionChange = (index) => {
                const newSelected = [...selectedOptions];
                newSelected[currentQIndex] = index;
                setSelectedOptions(newSelected);
            };

            const calculateEvaluation = () => {
                setIsEvaluating(true);
                
                // Wrap in try-catch to prevent loading infinite loop if error occurs
                setTimeout(() => {
                    try {
                        const expectedWordsRaw = currentPassage.toLowerCase().replace(/[^a-z0-9\s]/g, '').split(/\s+/).filter(Boolean);
                        const spokenWords = readingTranscript.toLowerCase().replace(/[^a-z0-9\s]/g, '').split(/\s+/).filter(Boolean);
                        
                        // Fair Algorithm: Balance Sequence & Word Matching
                        let matchCount = 0;
                        let searchIndex = 0;
                        const missedWordsList = [];

                        for (let i = 0; i < expectedWordsRaw.length; i++) {
                            let found = false;
                            for (let j = searchIndex; j < Math.min(searchIndex + 5, spokenWords.length); j++) {
                                if (spokenWords[j] === expectedWordsRaw[i]) {
                                    matchCount++;
                                    searchIndex = j + 1;
                                    found = true;
                                    break;
                                }
                            }
                            if (!found && expectedWordsRaw[i].length > 3) {
                                missedWordsList.push(expectedWordsRaw[i]);
                            }
                        }

                        const sequentialAccuracy = expectedWordsRaw.length > 0 ? (matchCount / expectedWordsRaw.length) : 0;
                        
                        // WPM (Words Per Minute) Calculation for Fluency
                        const durationSec = recordingDurationRef.current > 0 ? recordingDurationRef.current : 1;
                        const wpm = (spokenWords.length / durationSec) * 60;
                        
                        // Fair Fluency calculation
                        let fluScore = 80;
                        if (wpm < 90) fluScore -= (90 - wpm) * 0.5; // Mild penalty for slow
                        if (wpm > 170) fluScore -= (wpm - 170) * 0.5; // Mild penalty for rushing
                        fluScore = Math.max(20, Math.min(80, Math.round(fluScore)));

                        const smScore = Math.max(20, Math.min(80, Math.round((sequentialAccuracy * 60) + 20))); 
                        const proScore = Math.max(20, Math.min(80, Math.round((sequentialAccuracy * 50) + (fluScore * 0.2) + 10)));
                        const vocScore = Math.max(20, Math.min(80, Math.round(((1 - (missedWordsList.length / expectedWordsRaw.length)) * 60) + 20)));

                        // Overall Versant Score Formula
                        const versantScore = Math.round((0.3 * smScore) + (0.2 * vocScore) + (0.3 * fluScore) + (0.2 * proScore));

                        // Grade Badge Logic
                        let level = "Pre-Elementary";
                        let versantBadge = "V1";
                        if (versantScore >= 69) { level = "Native Mastery"; versantBadge = "V6"; }
                        else if (versantScore >= 58) { level = "Advanced Business"; versantBadge = "V5"; }
                        else if (versantScore >= 47) { level = "Proficient"; versantBadge = "V4"; }
                        else if (versantScore >= 36) { level = "Intermediate"; versantBadge = "V3"; }
                        else if (versantScore >= 26) { level = "Basic"; versantBadge = "V2"; }

                        // Logic MCQ Test
                        let correctCount = 0;
                        const failedQuestionsList = [];
                        const breakdown = assignedQuestions.map((item, idx) => {
                            const isMatch = selectedOptions[idx] === item.correctIndex;
                            if (isMatch) correctCount++;
                            else {
                                failedQuestionsList.push({
                                    qNum: idx + 1,
                                    question: item.q,
                                    agentSaid: selectedOptions[idx] !== null ? item.options[selectedOptions[idx]] : "Not Selected",
                                    expected: item.expected
                                });
                            }
                            return { question: item.q, candidateAnswer: selectedOptions[idx] !== null ? item.options[selectedOptions[idx]] : "Not Selected", isCorrect: isMatch, expected: item.expected };
                        });

                        // PASS criteria: V4+ (47+ Score) AND 3+ MCQ
                        const isPassed = versantScore >= 47 && correctCount >= 3;
                        
                        const detailedMistakes = [];
                        let aoiList = [];

                        if (versantScore < 47) {
                            detailedMistakes.push({ title: `Versant Speech Benchmark Missed (Score: ${versantScore}/80)`, desc: `Agent's communication did not meet the V4 (Proficient) benchmark.` });
                            aoiList.push("Improve Sentence Mastery by reading text confidently and continuously.");
                        }
                        if (correctCount < 3) {
                            detailedMistakes.push({ title: `Cognitive Logic Failure (${correctCount}/5)`, desc: `Agent failed context-based MCQ logic.` });
                            aoiList.push("Improve cognitive logic to accurately select contextually correct choices.");
                        }

                        if (isPassed) aoiList.push("Maintain current speaking fluency, sentence mastery, and logical accuracy.");

                        setResult({
                            isPassed, versantScore, level, versantBadge, 
                            sm: smScore, voc: vocScore, flu: fluScore, pro: proScore, wpm: Math.round(wpm),
                            correctCount, missedWordsList, failedQuestionsList,
                            detailedMistakes, breakdown, aoiList,
                            timestamp: new Date().toLocaleString()
                        });

                        setStep(3);
                    } catch (error) {
                        console.error("Evaluation Error:", error);
                        alert("Kuch error aagaya hai evaluation me. Kripya page refresh karein.");
                    } finally {
                        setIsEvaluating(false);
                    }
                }, 1000);
            };

            const downloadExcelCSV = () => {
                const rows = [
                    ["VERSANT AI ASSESSMENT - OFFICIAL REPORT"],
                    [],
                    ["Candidate Name", agentName], 
                    ["Candidate ID", agentId || "N/A"], 
                    ["Test Date & Time", result.timestamp],
                    ["Final Status", result.isPassed ? "PASSED (Qualified)" : "FAILED (Disqualified)"], 
                    [],
                    ["--- AI SPEECH METRICS (Scale 20 - 80) ---"],
                    ["Overall Versant Score", result.versantScore],
                    ["AI Versant Grade Badge", `${result.versantBadge} - ${result.level}`], 
                    ["Calculated WPM (Speed)", `${result.wpm} Words per Minute`],
                    ["Sentence Mastery", result.sm], 
                    ["Fluency", result.flu], 
                    ["Pronunciation", result.pro],
                    ["Vocabulary", result.voc], 
                    [],
                    ["--- LOGIC & COGNITIVE METRICS ---"],
                    ["Logic MCQ Test Score", `${result.correctCount} out of 5 Correct`],
                    [],
                    ["--- AUDIT & FEEDBACK ---"],
                    ["Areas of Improvement (AOI)", result.aoiList.join(" | ")],
                    ["Failure Details", result.isPassed ? "None. Outstanding Performance." : result.detailedMistakes.map(m => m.title).join(" | ")]
                ];
                const csvContent = "data:text/csv;charset=utf-8," + rows.map(r => r.map(c => `"${c}"`).join(",")).join("\n");
                const link = document.createElement("a");
                link.href = encodeURI(csvContent);
                link.download = `${agentName.replace(/\s+/g, '_')}_Versant_Excel_Report.csv`;
                document.body.appendChild(link);
                link.click();
            };

            const ProgressBar = ({ label, value, colorClass }) => (
                <div className="mb-3.5">
                    <div className="flex justify-between text-xs mb-1.5 font-semibold">
                        <span className="text-slate-600 uppercase tracking-wide">{label}</span>
                        <span className="text-slate-800">{value} / 80</span>
                    </div>
                    <div className="w-full bg-slate-200/70 rounded-full h-2.5">
                        <div className={`h-2.5 rounded-full ${colorClass} transition-all duration-500`} style={{ width: `${(value/80)*100}%` }}></div>
                    </div>
                </div>
            );

            return (
                <div className="max-w-4xl mx-auto">
                    <div className="bg-white border border-slate-200 rounded-2xl shadow-sm p-6 mb-6 flex items-center justify-between">
                        <div className="flex items-center gap-3">
                            <div className="w-12 h-12 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-black text-2xl shadow-lg shadow-indigo-500/25">V</div>
                            <div>
                                <h1 className="text-xl font-extrabold text-slate-900 tracking-tight">AI Versant Diagnostic Portal</h1>
                                <p className="text-xs font-semibold text-slate-500">Automated Voice & Error Analysis Engine</p>
                            </div>
                        </div>
                        {isRecording && (
                            <div className="flex items-center gap-2 px-3 py-1.5 bg-rose-50 border border-rose-200 rounded-full text-rose-600 text-xs font-bold">
                                <div className="audio-wave"><span></span><span></span><span></span><span></span></div>
                                MIC ACTIVE
                            </div>
                        )}
                    </div>

                    {step === 0 && (
                        <div className="bg-white border border-slate-200 rounded-2xl shadow-sm p-8 sm:p-10">
                            <h2 className="text-2xl font-bold text-slate-900 mb-2">Candidate Verification</h2>
                            <p className="text-slate-500 text-sm mb-8 font-medium">Candidate ka naam enter karein. Har candidate ko naya random reading passage aur questions milenge.</p>
                            <div className="space-y-4 max-w-md mb-8">
                                <div>
                                    <label className="block text-sm font-bold text-slate-700 mb-2">Candidate Full Name *</label>
                                    <input type="text" value={agentName} onChange={(e) => setAgentName(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-600 outline-none"/>
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-slate-700 mb-2">Agent ID (Optional)</label>
                                    <input type="text" value={agentId} onChange={(e) => setAgentId(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-600 outline-none"/>
                                </div>
                            </div>
                            <button onClick={handleStartTest} className="px-8 py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition shadow-lg shadow-indigo-600/25">Start Assessment →</button>
                        </div>
                    )}

                    {step === 1 && (
                        <div className="bg-white border border-slate-200 rounded-2xl shadow-sm p-8">
                            <div className="flex justify-between items-center mb-6 pb-4 border-b border-slate-100">
                                <div>
                                    <span className="text-xs font-extrabold text-indigo-600 uppercase tracking-wider">Part 1 of 2</span>
                                    <h2 className="text-2xl font-bold text-slate-900 mt-1">Reading Fluency Assessment</h2>
                                    <p className="text-xs font-semibold text-slate-500 mt-1">Record button dabayein aur saaf aawaz me passage padhein.</p>
                                </div>
                            </div>
                            <div className="bg-slate-50 border border-slate-200 rounded-xl p-6 text-lg leading-relaxed whitespace-pre-line mb-6 font-medium text-slate-800">
                                {currentPassage}
                            </div>
                            <div className="flex items-center gap-4 pt-4 border-t border-slate-100">
                                {!isRecording && !hasRecordedCurrent && (
                                    <button onClick={startRecording} className="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition shadow-md flex items-center gap-2">🎙️ Start Reading</button>
                                )}
                                {isRecording && (
                                    <button onClick={stopRecording} className="px-6 py-3 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl transition shadow-md flex items-center gap-2">■ Stop Reading</button>
                                )}
                                {!isRecording && hasRecordedCurrent && (
                                    <button onClick={() => setStep(2)} className="px-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition shadow-md">Proceed to Logic Test →</button>
                                )}
                            </div>
                        </div>
                    )}

                    {step === 2 && assignedQuestions.length > 0 && (
                        <div className="bg-white border border-slate-200 rounded-2xl shadow-sm p-8">
                            <div className="flex justify-between items-center mb-6 pb-4 border-b border-slate-100">
                                <div>
                                    <span className="text-xs font-extrabold text-indigo-600 uppercase tracking-wider">Part 2 of 2</span>
                                    <h2 className="text-2xl font-bold text-slate-900 mt-1">Cognitive Logic MCQ Test</h2>
                                </div>
                                <span className="text-sm font-bold bg-slate-100 text-slate-700 px-3 py-1 rounded-lg">Question {currentQIndex + 1} / 5</span>
                            </div>

                            <div className="bg-slate-50 border border-slate-200 rounded-xl p-6 mb-6">
                                <p className="text-2xl font-bold text-slate-900 mb-4">{assignedQuestions[currentQIndex].q}</p>
                                <div className="space-y-3">
                                    {assignedQuestions[currentQIndex].options.map((opt, i) => (
                                        <label key={i} className={`flex items-center gap-3 p-3 rounded-lg border cursor-pointer transition ${selectedOptions[currentQIndex] === i ? 'bg-indigo-50 border-indigo-500' : 'bg-white border-slate-300 hover:bg-slate-50'}`}>
                                            <input type="radio" name={`mcq-${currentQIndex}`} checked={selectedOptions[currentQIndex] === i} onChange={() => handleOptionChange(i)} className="w-5 h-5 text-indigo-600"/>
                                            <span className="text-lg font-medium text-slate-800">{opt}</span>
                                        </label>
                                    ))}
                                </div>
                            </div>
                            <div className="flex items-center gap-4 pt-4 border-t border-slate-100">
                                {currentQIndex < 4 ? (
                                    <button onClick={() => setCurrentQIndex(prev => prev + 1)} disabled={selectedOptions[currentQIndex] === null} className={`px-6 py-3 font-bold rounded-xl transition shadow-md ${selectedOptions[currentQIndex] === null ? 'bg-slate-300 text-slate-500 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-700 text-white'}`}>Next Question →</button>
                                ) : (
                                    <button onClick={calculateEvaluation} disabled={selectedOptions[currentQIndex] === null} className={`px-8 py-3 font-bold rounded-xl transition shadow-md ${selectedOptions[currentQIndex] === null ? 'bg-slate-300 text-slate-500 cursor-not-allowed' : 'bg-slate-900 hover:bg-black text-white'}`}>{isEvaluating ? "Analyzing Versant Metrics..." : "Submit & Generate Report"}</button>
                                )}
                            </div>
                        </div>
                    )}

                    {step === 3 && result && (
                        <div className="space-y-6">
                            <div className="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
                                <div className={`px-8 py-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 ${result.isPassed ? "bg-emerald-600" : "bg-rose-600"} text-white`}>
                                    <div>
                                        <h2 className="text-3xl font-black">{agentName}</h2>
                                        <p className="text-sm font-medium opacity-90 mt-1">{result.timestamp} • {agentId || "No ID"}</p>
                                    </div>
                                    <div className="text-left sm:text-right">
                                        <div className="text-4xl font-black">{result.versantScore}<span className="text-xl opacity-80">/80</span></div>
                                        <p className="text-xs uppercase font-bold tracking-wider opacity-90">Versant Speaking Score</p>
                                        <div className="flex gap-2 mt-3 justify-start sm:justify-end flex-wrap">
                                            <span className="px-3 py-1 bg-white/20 rounded-full text-xs font-bold uppercase tracking-wider backdrop-blur-sm">
                                                {result.isPassed ? "✓ OVERALL PASSED" : "✕ FAILED"}
                                            </span>
                                        </div>
                                    </div>
                                </div>

                                <div className="p-8 grid grid-cols-1 md:grid-cols-2 gap-8">
                                    <div>
                                        <h3 className="text-lg font-bold text-slate-900 mb-1">AI Speech Metrics</h3>
                                        <p className="text-xs text-slate-500 mb-4 font-semibold">Scale: 20-80 (Fair Evaluation Algorithm)</p>
                                        <ProgressBar label={`Sentence Mastery`} value={result.sm} colorClass="bg-indigo-600" />
                                        <ProgressBar label={`Fluency (Pacing)`} value={result.flu} colorClass="bg-blue-600" />
                                        <ProgressBar label={`Pronunciation`} value={result.pro} colorClass="bg-amber-500" />
                                        <ProgressBar label={`Vocabulary`} value={result.voc} colorClass="bg-emerald-600" />
                                        
                                        <div className="mt-5 p-4 border border-slate-200 rounded-xl bg-slate-50 flex items-center justify-between">
                                            <div>
                                                <span className="text-sm font-bold text-slate-700 block">Logic MCQ Test</span>
                                                <span className="text-xs text-slate-500 font-medium">Cognitive Context Score</span>
                                            </div>
                                            <span className={`px-3 py-1 rounded-full text-xs font-bold ${result.correctCount >= 3 ? "bg-emerald-100 text-emerald-700" : "bg-rose-100 text-rose-700"}`}>
                                                {result.correctCount} / 5 Correct
                                            </span>
                                        </div>
                                    </div>

                                    <div>
                                        <div className="mb-5 p-4 rounded-xl bg-indigo-50 border border-indigo-200 flex items-center justify-between shadow-inner">
                                            <div>
                                                <h4 className="text-xs font-bold text-indigo-600 uppercase tracking-wider mb-1">Final Versant Badge</h4>
                                                <p className="text-xl font-bold text-indigo-900">{result.level}</p>
                                            </div>
                                            <div className="w-16 h-16 bg-indigo-600 text-white rounded-full flex items-center justify-center text-3xl font-black shadow-lg border-4 border-indigo-200">
                                                {result.versantBadge}
                                            </div>
                                        </div>

                                        <h3 className="text-lg font-bold text-slate-900 mb-3">Areas of Improvement (AOI)</h3>
                                        <ul className="list-disc pl-5 text-sm font-medium text-slate-700 space-y-2 mb-6">
                                            {result.aoiList.map((aoi, i) => (
                                                <li key={i}>{aoi}</li>
                                            ))}
                                        </ul>

                                        <button onClick={downloadExcelCSV} className="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition text-sm flex items-center justify-center gap-2 shadow-lg">
                                            📊 Download Official Excel / CSV Report
                                        </button>
                                    </div>
                                </div>
                            </div>

                            {!result.isPassed && (
                                <div className="bg-white border-2 border-rose-200 rounded-2xl shadow-sm p-6 sm:p-8">
                                    <div className="flex items-center gap-2 mb-4 pb-3 border-b border-rose-100">
                                        <span className="w-8 h-8 rounded-lg bg-rose-100 text-rose-600 flex items-center justify-center font-bold text-lg">⚠️</span>
                                        <div>
                                            <h3 className="text-lg font-bold text-slate-900">Failure Diagnostics</h3>
                                            <p className="text-xs text-slate-500">Reasons why the AI Engine failed the candidate:</p>
                                        </div>
                                    </div>
                                    <div className="space-y-3">
                                        {result.detailedMistakes.map((item, idx) => (
                                            <div key={idx} className="p-4 rounded-xl bg-rose-50 border border-rose-200">
                                                <p className="text-sm font-bold text-rose-900">{idx + 1}. {item.title}</p>
                                                <p className="text-xs text-rose-700 mt-1 font-medium">{item.desc}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            <div className="bg-white border border-slate-200 rounded-2xl shadow-sm p-6 sm:p-8">
                                <h3 className="text-lg font-bold text-slate-900 mb-6 pb-3 border-b border-slate-100">Test Breakdown Audit</h3>
                                
                                <div className="mb-8 p-4 bg-slate-50 rounded-xl border border-slate-200">
                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-3">
                                        <div>
                                            <p className="text-sm font-bold text-indigo-700">Reading Speed / Pacing Metrics</p>
                                            <p className="text-xs text-slate-600 mt-1">Agent Reading Speed: <strong>{result.wpm} Words per minute</strong> (Target: 100-160 WPM)</p>
                                        </div>
                                        {readingAudioURL && <audio controls src={readingAudioURL} className="h-8 w-full sm:w-64" />}
                                    </div>
                                    {result.missedWordsList && result.missedWordsList.length > 0 && (
                                        <div className="mt-4 pt-4 border-t border-slate-200">
                                            <p className="text-xs font-bold uppercase text-slate-600 mb-2">Sequence Errors / Missed Words:</p>
                                            <div className="flex flex-wrap gap-1.5">
                                                {result.missedWordsList.map((word, wIdx) => (
                                                    <span key={wIdx} className="px-2.5 py-1 bg-rose-100 text-rose-800 border border-rose-200 rounded-md text-xs font-bold">{word}</span>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>
                                
                                <div className="space-y-4">
                                    <p className="text-sm font-bold text-indigo-700">5 Logic MCQs Breakdown</p>
                                    {result.breakdown.map((item, idx) => (
                                        <div key={idx} className="p-4 bg-white border border-slate-200 rounded-xl">
                                            <div className="flex justify-between items-center mb-2">
                                                <p className="text-sm font-bold text-slate-800">Q{idx + 1}: {item.question}</p>
                                                <span className={`text-xs font-bold px-2 py-0.5 rounded ${item.isCorrect ? "bg-emerald-100 text-emerald-700" : "bg-rose-100 text-rose-700"}`}>
                                                    {item.isCorrect ? "Correct" : "Incorrect"}
                                                </span>
                                            </div>
                                            <div className="text-xs mt-3 bg-slate-50 p-3 rounded-lg flex flex-col gap-1">
                                                <p><span className="text-slate-500 font-bold">Selected:</span> <span className="font-medium text-slate-800">{item.candidateAnswer}</span></p>
                                                <p><span className="text-slate-500 font-bold">Expected:</span> <span className="font-semibold text-emerald-700">{item.expected}</span></p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            
                            <div className="text-center pb-8">
                                <button onClick={() => window.location.reload()} className="px-6 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold text-sm rounded-xl transition">
                                    ↻ Conduct Test for New Agent
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
