<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Versant Test Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-8 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const SUBJECT_TEXT = "Welcome to the customer support center. I am here to help you resolve your internet connectivity issues today. Please ensure your router is plugged in and the green light is flashing.";
        
        const QUESTIONS = [
            "What is the main purpose of this support center?",
            "What device should the customer check?",
            "What specific light indicator should the customer look for?"
        ];

        function App() {
            const [agentName, setAgentName] = useState("");
            const [step, setStep] = useState(0); 
            const [isRecording, setIsRecording] = useState(false);
            const [hasRecordedCurrent, setHasRecordedCurrent] = useState(false); // New state to block re-recording
            
            const [readingTranscript, setReadingTranscript] = useState("");
            const [qaTranscripts, setQaTranscripts] = useState(["", "", ""]);
            const [currentQ, setCurrentQ] = useState(0);
            
            const [audioURL, setAudioURL] = useState(null);
            const [scoreData, setScoreData] = useState(null);
            const [isEvaluating, setIsEvaluating] = useState(false);

            const mediaRecorder = useRef(null);
            const audioChunks = useRef([]);
            const recognition = useRef(null);

            useEffect(() => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognition) {
                    recognition.current = new SpeechRecognition();
                    recognition.current.continuous = true;
                    recognition.current.interimResults = true;
                    
                    recognition.current.onresult = (event) => {
                        let finalTranscript = '';
                        for (let i = event.resultIndex; i < event.results.length; ++i) {
                            if (event.results[i].isFinal) {
                                finalTranscript += event.results[i][0].transcript + ' ';
                            }
                        }
                        if (step === 1) {
                            setReadingTranscript(prev => prev + finalTranscript);
                        } else if (step === 2) {
                            const newQa = [...qaTranscripts];
                            newQa[currentQ] += finalTranscript;
                            setQaTranscripts(newQa);
                        }
                    };
                }
            }, [step, currentQ, qaTranscripts]);

            const startRecording = async () => {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder.current = new MediaRecorder(stream);
                
                mediaRecorder.current.ondataavailable = (e) => {
                    audioChunks.current.push(e.data);
                };

                mediaRecorder.current.onstop = () => {
                    const audioBlob = new Blob(audioChunks.current, { type: 'audio/webm' });
                    const url = URL.createObjectURL(audioBlob);
                    setAudioURL(url);
                };

                audioChunks.current = [];
                mediaRecorder.current.start();
                if (recognition.current) recognition.current.start();
                setIsRecording(true);
            };

            const stopRecording = () => {
                if (mediaRecorder.current) mediaRecorder.current.stop();
                if (recognition.current) recognition.current.stop();
                setIsRecording(false);
                setHasRecordedCurrent(true); // Lock the recording button
            };

            const evaluateWithAI = async () => {
                setIsEvaluating(true);
                const API_KEY = "YOUR_GEMINI_API_KEY_HERE"; 
                
                const prompt = `
                    Evaluate this Versant test. 
                    Original text: ${SUBJECT_TEXT}
                    Agent read: ${readingTranscript}
                    
                    Q1: ${QUESTIONS[0]} | Ans: ${qaTranscripts[0]}
                    Q2: ${QUESTIONS[1]} | Ans: ${qaTranscripts[1]}
                    Q3: ${QUESTIONS[2]} | Ans: ${qaTranscripts[2]}
                    
                    Return ONLY a JSON object with this structure:
                    {"versant_level": "V#", "pronunciation": 0-100, "fluency": 0-100, "mastery": 0-100, "vocabulary": 0-100, "feedback": "brief summary"}
                `;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    
                    const data = await response.json();
                    let aiText = data.candidates[0].content.parts[0].text;
                    aiText = aiText.replace(/```json/g, '').replace(/```/g, '');
                    setScoreData(JSON.parse(aiText));
                    setStep(3);
                } catch (error) {
                    console.error("AI Evaluation failed", error);
                    alert("Evaluation failed. Please check your API key.");
                }
                setIsEvaluating(false);
            };

            const downloadCSV = () => {
                const csvContent = "data:text/csv;charset=utf-8," 
                    + "Agent Name,Level,Pronunciation,Fluency,Mastery,Vocabulary\n"
                    + `${agentName},${scoreData.versant_level},${scoreData.pronunciation},${scoreData.fluency},${scoreData.mastery},${scoreData.vocabulary}`;
                
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `${agentName}_versant_score.csv`);
                document.body.appendChild(link);
                link.click();
            };

            const renderHighlightedText = () => {
                const originalWords = SUBJECT_TEXT.toLowerCase().replace(/[.,]/g, '').split(' ');
                const spokenWords = readingTranscript.toLowerCase().split(' ');

                return originalWords.map((word, idx) => {
                    const isMatched = spokenWords.includes(word);
                    return (
                        <span key={idx} className={isMatched ? "text-green-400" : "text-red-400"}>
                            {word}{' '}
                        </span>
                    );
                });
            };

            return (
                <div className="max-w-4xl mx-auto bg-slate-800 p-8 rounded-lg shadow-xl">
                    <h1 className="text-3xl font-bold mb-6 border-b border-slate-700 pb-4">Versant AI Portal</h1>
                    
                    {step === 0 && (
                        <div>
                            <label className="block mb-2 text-lg">Enter Agent Name:</label>
                            <input type="text" value={agentName} onChange={(e) => setAgentName(e.target.value)} className="w-full p-3 rounded bg-slate-700 mb-4 outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g., Rahul Sharma"/>
                            <button onClick={() => {if(agentName) setStep(1)}} className="bg-blue-600 px-6 py-2 rounded hover:bg-blue-500 font-semibold">Start Test</button>
                        </div>
                    )}

                    {step === 1 && (
                        <div>
                            <h2 className="text-xl mb-4">Part 1: Reading Assessment</h2>
                            <div className="bg-slate-700 p-6 rounded text-xl leading-relaxed mb-6 font-medium">
                                {isRecording ? renderHighlightedText() : SUBJECT_TEXT}
                            </div>
                            <div className="flex gap-4">
                                {!isRecording && !hasRecordedCurrent && (
                                    <button onClick={startRecording} className="bg-red-600 px-6 py-2 rounded hover:bg-red-500">Start Reading</button>
                                )}
                                {isRecording && (
                                    <button onClick={stopRecording} className="bg-slate-600 px-6 py-2 rounded hover:bg-slate-500">Stop Reading</button>
                                )}
                                {!isRecording && hasRecordedCurrent && (
                                    <button onClick={() => {setStep(2); setHasRecordedCurrent(false);}} className="bg-blue-600 px-6 py-2 rounded hover:bg-blue-500">Proceed to Questions</button>
                                )}
                            </div>
                        </div>
                    )}

                    {step === 2 && (
                        <div>
                            <h2 className="text-xl mb-4">Part 2: Comprehension Questions</h2>
                            <div className="bg-slate-700 p-6 rounded mb-6">
                                <p className="text-2xl font-semibold text-blue-300">Question {currentQ + 1} of 3</p>
                                <p className="text-xl mt-2">{QUESTIONS[currentQ]}</p>
                                <p className="mt-4 text-slate-400 italic">Agent Answer: {qaTranscripts[currentQ]}</p>
                            </div>
                            <div className="flex gap-4">
                                {!isRecording && !hasRecordedCurrent && (
                                    <button onClick={startRecording} className="bg-red-600 px-6 py-2 rounded hover:bg-red-500">Record Answer</button>
                                )}
                                {isRecording && (
                                    <button onClick={stopRecording} className="bg-slate-600 px-6 py-2 rounded hover:bg-slate-500">Stop Answer</button>
                                )}
                                {!isRecording && hasRecordedCurrent && currentQ < 2 && (
                                    <button onClick={() => {setCurrentQ(prev => prev + 1); setHasRecordedCurrent(false);}} className="bg-blue-600 px-6 py-2 rounded hover:bg-blue-500">Next Question</button>
                                )}
                                {!isRecording && hasRecordedCurrent && currentQ === 2 && (
                                    <button onClick={evaluateWithAI} className="bg-green-600 px-6 py-2 rounded hover:bg-green-500">
                                        {isEvaluating ? "Analyzing..." : "Submit to AI"}
                                    </button>
                                )}
                            </div>
                        </div>
                    )}

                    {step === 3 && scoreData && (
                        <div>
                            <h2 className="text-2xl font-bold mb-6 text-green-400">Result Dashboard: {agentName}</h2>
                            <div className="grid grid-cols-2 gap-6 mb-6">
                                <div className="bg-slate-700 p-6 rounded flex flex-col items-center justify-center">
                                    <p className="text-slate-400">Overall Versant Level</p>
                                    <p className="text-5xl font-bold text-white mt-2">{scoreData.versant_level}</p>
                                </div>
                                <div className="bg-slate-700 p-6 rounded grid grid-cols-2 gap-4 text-center">
                                    <div><p className="text-sm text-slate-400">Pronunciation</p><p className="text-2xl">{scoreData.pronunciation}</p></div>
                                    <div><p className="text-sm text-slate-400">Fluency</p><p className="text-2xl">{scoreData.fluency}</p></div>
                                    <div><p className="text-sm text-slate-400">Mastery</p><p className="text-2xl">{scoreData.mastery}</p></div>
                                    <div><p className="text-sm text-slate-400">Vocabulary</p><p className="text-2xl">{scoreData.vocabulary}</p></div>
                                </div>
                            </div>
                            <div className="bg-slate-700 p-4 rounded mb-6">
                                <p className="font-semibold text-blue-300 mb-2">AI Feedback:</p>
                                <p>{scoreData.feedback}</p>
                            </div>
                            <div className="flex gap-4">
                                <button onClick={downloadCSV} className="bg-blue-600 px-6 py-2 rounded hover:bg-blue-500">Download Excel/CSV</button>
                                {audioURL && (
                                    <a href={audioURL} download={`${agentName}_audio.webm`} className="bg-slate-600 px-6 py-2 rounded hover:bg-slate-500 inline-block">Download Audio</a>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
