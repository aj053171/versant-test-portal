<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Versant Assessment Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .audio-wave { display: flex; align-items: center; gap: 3px; }
        .audio-wave span {
            display: block; width: 3px; height: 10px; background-color: #ef4444;
            border-radius: 3px; animation: wave 1s ease-in-out infinite;
        }
        .audio-wave span:nth-child(2) { animation-delay: 0.1s; }
        .audio-wave span:nth-child(3) { animation-delay: 0.2s; }
        .audio-wave span:nth-child(4) { animation-delay: 0.3s; }
        @keyframes wave { 0%, 100% { height: 10px; } 50% { height: 24px; } }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen py-10 px-4 sm:px-6">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // UPDATED: 5-Line Reading Passages (Call Center, Inbound, Job, CSAT)
        const READING_PASSAGES = [
            "Welcome to our inbound call center where customer satisfaction is our top priority.\nWe handle hundreds of queries daily ranging from technical support to billing inquiries.\nAs a customer service representative, active listening and empathy are your best tools.\nAlways ensure that you verify the caller's account details before proceeding with any changes.\nBy resolving issues on the first call, we maintain a high CSAT score and build lasting brand loyalty.",
            
            "Thank you for contacting our premium technical support desk today.\nBefore we begin troubleshooting your internet connection, please check your router.\nEnsure that all cables are securely plugged in and the power light is steady green.\nIf the network indicator is blinking red, we may need to reset the system remotely.\nOur goal is to restore your services as quickly and efficiently as possible.",
            
            "Handling an upset customer requires extreme patience and a very calm demeanor.\nAlways start by sincerely apologizing for the inconvenience they have experienced.\nTake detailed notes of their complaint to avoid making them repeat themselves.\nIf the issue is beyond your authorization limit, politely escalate it to a supervisor.\nFollowing these steps ensures the customer feels heard and valued by our company.",
            
            "As part of our outbound sales team, your communication skills must be excellent.\nEvery phone call is a unique opportunity to understand the client's current needs.\nOnce you identify their requirements, confidently present our premium product features.\nDo not forget to mention the exclusive discounts available for long-term subscriptions.\nClosing a sale successfully benefits both the customer's business and our organization.",
            
            "Effective time management allows agents to achieve greater productivity and reduce workplace stress.\nStart your shift by reviewing pending tickets and prioritizing urgent customer callbacks.\nAvoid multitasking during live calls as it can lead to errors and decrease overall focus.\nTaking short, regular breaks between heavy call volumes helps maintain high energy levels.\nBy sticking to this organized schedule, you can ensure a healthy work-life balance and success."
        ];

        // NEW: 1-Line & 2-Line Sentences for AI Repeat Test (Expanded for randomness)
        const REPEAT_SENTENCES = [
            "Thank you for calling One Assist customer support. My name is Alex, how can I assist you with your membership today?",
            "I completely understand your frustration regarding the device protection claim. I will help you get it sorted out immediately.",
            "Could you please confirm your registered email address and phone number? This will help me pull up your account details securely.",
            "We appreciate your patience while I check the status of your recent repair request. Our authorized service center should update it soon.",
            "As a valued member, you are eligible for an upgrade on your current plan. This upgrade includes extended warranty benefits and free screen replacement.",
            "Please ensure your device is backed up before you hand it over to the technician. We are not responsible for any data loss during the repair.",
            "Your feedback is very important to us. Could you please stay on the line for a brief two-minute survey after our call?",
            "I am sorry for the inconvenience caused by the delayed pickup. Let me reschedule it for a time that is more convenient for you."
        ];

        // NEW: 3-Line Typing Passages
        const TYPING_PASSAGES = [
            "Customer service requires patience, active listening, and a positive attitude at all times.\nEvery interaction is a unique opportunity to build brand loyalty and trust with the client.\nEffective and clear communication ensures high customer satisfaction and swift issue resolution.",
            
            "Inbound call centers operate efficiently when agents process information quickly and accurately.\nTyping speed and accurate data entry are essential skills for managing customer accounts.\nAlways double-check the details provided by the caller before submitting the final ticket.",
            
            "Empathy is the cornerstone of handling difficult conversations and frustrated customers.\nAcknowledging the problem and offering an immediate apology can completely change the call.\nStrive to achieve first call resolution to improve our overall service quality metrics."
        ];

        const MASTER_QUESTION_POOL = [
            { q: "Which is faster: a bicycle or a jet plane?", options: ["A bicycle", "A jet plane", "A car"], correctIndex: 1, expected: "A jet plane" },
            { q: "To keep ice cream cold, should you put it in the oven or the freezer?", options: ["The oven", "The freezer", "The microwave"], correctIndex: 1, expected: "The freezer" },
            { q: "If a shirt is too big, is it tight or loose?", options: ["Tight", "Loose", "Perfect"], correctIndex: 1, expected: "Loose" },
            { q: "Which is heavier: a pillow or a brick?", options: ["A pillow", "A brick", "A feather"], correctIndex: 1, expected: "A brick" },
            { q: "Does a standard traffic light use red or blue to tell drivers to stop?", options: ["Red", "Blue", "Green"], correctIndex: 0, expected: "Red" },
            { q: "If you want to cut a piece of paper, would you use scissors or a pen?", options: ["A pen", "A ruler", "Scissors"], correctIndex: 2, expected: "Scissors" },
            { q: "What is the opposite of the word 'heavy'?", options: ["Light", "Big", "Strong"], correctIndex: 0, expected: "Light" },
            { q: "If you are not awake, what are you?", options: ["Running", "Asleep", "Eating"], correctIndex: 1, expected: "Asleep" },
            { q: "Is your father's sister your aunt or your uncle?", options: ["Aunt", "Uncle", "Cousin"], correctIndex: 0, expected: "Aunt" }
        ];

        function getRandomItems(pool, count = 5) {
            const arr = [...pool];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr.slice(0, count);
        }

        function App() {
            const [agentName, setAgentName] = useState("");
            const [agentId, setAgentId] = useState("");
            
            // Steps: 0:Login, 1:Reading, 2:Repeat, 3:Typing, 4:MCQ, 5:Dashboard
            const [step, setStep] = useState(0); 
            const stepRef = useRef(step);

            // Step 1: Reading State
            const [currentPassage, setCurrentPassage] = useState("");
            const [readingTranscript, setReadingTranscript] = useState("");
            const [readingAudioURL, setReadingAudioURL] = useState(null);
            const [readingCountdown, setReadingCountdown] = useState(5);

            // Step 2: Repeat State
            const [currentRepeat, setCurrentRepeat] = useState("");
            const [repeatTranscript, setRepeatTranscript] = useState("");
            const [repeatAudioURL, setRepeatAudioURL] = useState(null);
            const [hasPlayedAI, setHasPlayedAI] = useState(false);

            // Step 3: Typing State
            const [currentTyping, setCurrentTyping] = useState("");
            const [typingInput, setTypingInput] = useState("");
            const [typingTimeLeft, setTypingTimeLeft] = useState(120);

            // Step 4: MCQ State
            const [assignedQuestions, setAssignedQuestions] = useState([]);
            const [currentQIndex, setCurrentQIndex] = useState(0);
            const [selectedOptions, setSelectedOptions] = useState(new Array(5).fill(null));

            // Global Recording State
            const [isRecording, setIsRecording] = useState(false);
            const [hasRecordedCurrent, setHasRecordedCurrent] = useState(false);
            const mediaRecorder = useRef(null);
            const audioChunks = useRef([]);
            const recognition = useRef(null);
            const recordingStartTimeRef = useRef(null);
            const recordingDurationRef = useRef(0);

            // Results State
            const [result, setResult] = useState(null);
            const [isEvaluating, setIsEvaluating] = useState(false);

            // Sync step state to ref for speech recognition closure
            useEffect(() => {
                stepRef.current = step;
            }, [step]);

            // Speech Recognition Initialization
            useEffect(() => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognition) {
                    recognition.current = new SpeechRecognition();
                    recognition.current.continuous = true;
                    recognition.current.interimResults = true;
                    recognition.current.lang = 'en-US';

                    recognition.current.onresult = (event) => {
                        let text = '';
                        for (let i = event.resultIndex; i < event.results.length; ++i) {
                            if (event.results[i].isFinal) {
                                text += event.results[i][0].transcript + ' ';
                            }
                        }
                        if (stepRef.current === 1) {
                            setReadingTranscript(prev => prev + text);
                        } else if (stepRef.current === 2) {
                            setRepeatTranscript(prev => prev + text);
                        }
                    };
                }
            }, []);

            // Auto-start Reading countdown
            useEffect(() => {
                let timer;
                if (step === 1 && readingCountdown > 0 && !isRecording && !hasRecordedCurrent) {
                    timer = setTimeout(() => setReadingCountdown(prev => prev - 1), 1000);
                } else if (step === 1 && readingCountdown === 0 && !isRecording && !hasRecordedCurrent) {
                    startRecording();
                }
                return () => clearTimeout(timer);
            }, [step, readingCountdown, isRecording, hasRecordedCurrent]);

            // Typing Timer
            useEffect(() => {
                let timer;
                if (step === 3 && typingTimeLeft > 0) {
                    timer = setTimeout(() => setTypingTimeLeft(prev => prev - 1), 1000);
                } else if (step === 3 && typingTimeLeft === 0) {
                    setStep(4); // Force next step when time is up
                }
                return () => clearTimeout(timer);
            }, [step, typingTimeLeft]);

            const handleStartTest = () => {
                if (!agentName.trim()) {
                    alert("Kripya candidate ka naam enter karein.");
                    return;
                }
                // Initialize random subjects
                setCurrentPassage(READING_PASSAGES[Math.floor(Math.random() * READING_PASSAGES.length)]);
                setCurrentRepeat(REPEAT_SENTENCES[Math.floor(Math.random() * REPEAT_SENTENCES.length)]);
                setCurrentTyping(TYPING_PASSAGES[Math.floor(Math.random() * TYPING_PASSAGES.length)]);
                setAssignedQuestions(getRandomItems(MASTER_QUESTION_POOL, 5));
                
                // Reset states
                setSelectedOptions(new Array(5).fill(null));
                setCurrentQIndex(0);
                setReadingTranscript("");
                setRepeatTranscript("");
                setTypingInput("");
                setReadingAudioURL(null);
                setRepeatAudioURL(null);
                setHasRecordedCurrent(false);
                setReadingCountdown(5);
                setHasPlayedAI(false);
                setTypingTimeLeft(120);

                setStep(1); // Go to Reading
            };

            const startRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder.current = new MediaRecorder(stream);
                    audioChunks.current = [];

                    mediaRecorder.current.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunks.current.push(e.data);
                    };

                    mediaRecorder.current.onstop = () => {
                        const audioBlob = new Blob(audioChunks.current, { type: 'audio/webm' });
                        const audioUrl = URL.createObjectURL(audioBlob);
                        if (stepRef.current === 1) {
                            setReadingAudioURL(audioUrl);
                        } else if (stepRef.current === 2) {
                            setRepeatAudioURL(audioUrl);
                        }
                    };

                    mediaRecorder.current.start();
                    if (recognition.current) {
                        try { recognition.current.start(); } catch (err) {}
                    }
                    recordingStartTimeRef.current = Date.now();
                    setIsRecording(true);
                } catch (err) {
                    alert("Microphone permission denied! Kripya browser me allow karein.");
                }
            };

            const stopRecording = () => {
                if (mediaRecorder.current && mediaRecorder.current.state !== "inactive") {
                    mediaRecorder.current.stop();
                }
                if (recognition.current) {
                    try { recognition.current.stop(); } catch (e) {}
                }
                
                if (step === 1) {
                    recordingDurationRef.current = (Date.now() - recordingStartTimeRef.current) / 1000; 
                }
                
                setIsRecording(false);
                setHasRecordedCurrent(true);
            };

            const playAIVoice = () => {
                setHasPlayedAI(true); // Enable recording option immediately to prevent browser blocking
                const utterance = new SpeechSynthesisUtterance(currentRepeat);
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            };

            const handleOptionChange = (index) => {
                const newSelected = [...selectedOptions];
                newSelected[currentQIndex] = index;
                setSelectedOptions(newSelected);
            };

            const calculateEvaluation = () => {
                setIsEvaluating(true);
                
                setTimeout(() => {
                    try {
                        // --- 1. Reading Assessment (Existing Logic) ---
                        const expectedWordsRaw = currentPassage.toLowerCase().replace(/[^a-z0-9\s]/g, '').split(/\s+/).filter(Boolean);
                        const spokenWords = readingTranscript.toLowerCase().replace(/[^a-z0-9\s]/g, '').split(/\s+/).filter(Boolean);
                        
                        let matchCount = 0;
                        let searchIndex = 0;
                        const missedWordsList = [];

                        for (let i = 0; i < expectedWordsRaw.length; i++) {
                            let found = false;
                            for (let j = searchIndex; j < Math.min(searchIndex + 5, spokenWords.length); j++) {
                                if (spokenWords[j] === expectedWordsRaw[i]) {
                                    matchCount++;
                                    searchIndex = j + 1;
                                    found = true;
                                    break;
                                }
                            }
                            if (!found && expectedWordsRaw[i].length > 3) {
                                missedWordsList.push(expectedWordsRaw[i]);
                            }
                        }

                        const sequentialAccuracy = expectedWordsRaw.length > 0 ? (matchCount / expectedWordsRaw.length) : 0;
                        
                        // Reading WPM
                        const durationSec = recordingDurationRef.current > 0 ? recordingDurationRef.current : 1;
                        const wpm = (spokenWords.length / durationSec) * 60;
                        
                        let fluScore = 80;
                        if (wpm < 90) fluScore -= (90 - wpm) * 0.5;
                        if (wpm > 170) fluScore -= (wpm - 170) * 0.5; 
                        fluScore = Math.max(10, Math.min(80, Math.round(fluScore)));

                        const smScore = Math.max(10, Math.min(80, Math.round((sequentialAccuracy * 70) + 10))); 
                        const proScore = Math.max(10, Math.min(80, Math.round((sequentialAccuracy * 50) + (fluScore * 0.2) + 14)));
                        const vocScore = Math.max(10, Math.min(80, Math.round(((1 - (missedWordsList.length / expectedWordsRaw.length)) * 70) + 10)));

                        const versantScore = Math.round((0.3 * smScore) + (0.2 * vocScore) + (0.3 * fluScore) + (0.2 * proScore));

                        // --- 2. Repeat Test Assessment ---
                        const repeatExpected = currentRepeat.toLowerCase().replace(/[^a-z0-9\s]/g, '').split(/\s+/).filter(Boolean);
                        const repeatSpoken = repeatTranscript.toLowerCase().replace(/[^a-z0-9\s]/g, '').split(/\s+/).filter(Boolean);
                        let repeatMatches = 0;
                        const spokenSet = new Set(repeatSpoken);
                        repeatExpected.forEach(word => { if(spokenSet.has(word)) repeatMatches++; });
                        const repeatAccuracy = repeatExpected.length > 0 ? Math.round((repeatMatches / repeatExpected.length) * 100) : 0;

                        // --- 3. Typing Test Assessment ---
                        const totalTypedChars = typingInput.length;
                        const minutesTaken = (120 - typingTimeLeft) / 60 || 1; // avoid /0
                        const rawTypingWpm = Math.round((totalTypedChars / 5) / minutesTaken);
                        
                        // Simple typing accuracy
                        const typeExpectedWords = currentTyping.split(/\s+/);
                        const typedWords = typingInput.split(/\s+/);
                        let typeMatches = 0;
                        typedWords.forEach((word, idx) => {
                            if(typeExpectedWords[idx] === word) typeMatches++;
                        });
                        const typeAccuracy = typedWords.length > 0 ? Math.round((typeMatches / typedWords.length) * 100) : 0;

                        // Individual Pass/Fail Logic for Test 2 & 3
                        const isRepeatPass = repeatAccuracy >= 70; // 70% accuracy required to pass
                        const isTypingPass = rawTypingWpm >= 25 && typeAccuracy >= 80; // 25 WPM and 80% accuracy required to pass

                        // --- Classification ---
                        let level = "", cefr = "", eligibility = "", versantBadge = "";
                        let isVoicePassed = false;
                        let isNonVoice = false;

                        if (versantScore >= 76) {
                            versantBadge = "V5"; level = "Expert"; cefr = "C2";
                            eligibility = "Elite Hiring: Passed for high-level corporate training, operational leadership, international client relations, and specialized technical analysis.";
                            isVoicePassed = true;
                        } else if (versantScore >= 67) {
                            versantBadge = "V4"; level = "Advanced"; cefr = "C1";
                            eligibility = "Premium Voice: Passed for high-tier US/UK enterprise accounts, premium banking operations, QA compliance, and complex troubleshooting.";
                            isVoicePassed = true;
                        } else if (versantScore >= 59) {
                            versantBadge = "V3"; level = "Voice Eligible"; cefr = "B2";
                            eligibility = "Standard Voice: Passed for international customer service voice processes, inbound technical helpdesks, and outbound tele-sales.";
                            isVoicePassed = true;
                        } else if (versantScore >= 51) {
                            versantBadge = "V2"; level = "Non-Voice Only"; cefr = "B1";
                            eligibility = "Non-Voice Only: Redirected away from international voice lines. Fully eligible for digital chat support, international email ticketing systems, and back-office operations.";
                            isVoicePassed = false; 
                            isNonVoice = true; // Soft pass
                        } else {
                            versantBadge = "V1"; level = "Below Benchmark"; cefr = "A1 - A2";
                            eligibility = "Domestic / Not Eligible: Passed only for domestic queues or internal administration. Upskill cooling-off period required.";
                            isVoicePassed = false;
                        }

                        // --- Logic MCQ Test ---
                        let correctCount = 0;
                        const failedQuestionsList = [];
                        const breakdown = assignedQuestions.map((item, idx) => {
                            const isMatch = selectedOptions[idx] === item.correctIndex;
                            if (isMatch) correctCount++;
                            else {
                                failedQuestionsList.push({
                                    qNum: idx + 1, question: item.q, agentSaid: selectedOptions[idx] !== null ? item.options[selectedOptions[idx]] : "Not Selected", expected: item.expected
                                });
                            }
                            return { question: item.q, candidateAnswer: selectedOptions[idx] !== null ? item.options[selectedOptions[idx]] : "Not Selected", isCorrect: isMatch, expected: item.expected };
                        });

                        const finalPassedStatus = (isVoicePassed || isNonVoice) && correctCount >= 3;
                        
                        const detailedMistakes = [];
                        let aoiList = [];

                        if (!isVoicePassed && !isNonVoice) {
                            detailedMistakes.push({ title: `Below V2 Benchmark (Score: ${versantScore}/80)`, desc: `Voice quality is not suitable for international processes.` });
                            aoiList.push("Needs significant training in pronunciation and reading comprehension.");
                        }
                        if (correctCount < 3) {
                            detailedMistakes.push({ title: `Cognitive Logic Failure (${correctCount}/5)`, desc: `Agent failed context-based MCQ logic. Minimum 3 correct required.` });
                            aoiList.push("Improve cognitive logic to accurately select contextually correct choices.");
                        }

                        if (finalPassedStatus && isVoicePassed) aoiList.push("Maintain current speaking fluency, sentence mastery, and logical accuracy.");
                        else if (finalPassedStatus && isNonVoice) aoiList.push("Good logic, but work on speaking fluency to upgrade to a Voice profile.");

                        setResult({
                            finalPassedStatus, isVoicePassed, isNonVoice, versantScore, level, versantBadge, cefr, eligibility,
                            sm: smScore, voc: vocScore, flu: fluScore, pro: proScore, wpm: Math.round(wpm),
                            repeatAccuracy, isRepeatPass, typeWpm: rawTypingWpm, typeAccuracy, isTypingPass,
                            correctCount, missedWordsList, failedQuestionsList,
                            detailedMistakes, breakdown, aoiList,
                            timestamp: new Date().toLocaleString()
                        });

                        setStep(5);
                    } catch (error) {
                        console.error("Evaluation Error:", error);
                        alert("Error generating report. Please retry.");
                    } finally {
                        setIsEvaluating(false);
                    }
                }, 1000);
            };

            const downloadExcelCSV = () => {
                const headers = [
                    "Candidate Name", 
                    "Candidate ID", 
                    "Test Date & Time", 
                    "Overall Result",
                    "Overall Versant Score", 
                    "Versant Grade Badge", 
                    "Communication Tier", 
                    "CEFR Level", 
                    "Agent Hiring Eligibility",
                    "Reading Speed (WPM)", 
                    "Sentence Mastery", 
                    "Fluency", 
                    "Pronunciation", 
                    "Vocabulary",
                    "AI Repeat Accuracy (%)", 
                    "Typing Speed (WPM)", 
                    "Typing Accuracy (%)",
                    "Logic MCQ Score", 
                    "Areas of Improvement", 
                    "Failure Details"
                ];

                const dataRow = [
                    agentName, 
                    agentId || "N/A", 
                    result.timestamp,
                    result.finalPassedStatus ? (result.isVoicePassed ? "PASSED (Voice Profile)" : "PASSED (Non-Voice Profile)") : "FAILED / DOMESTIC",
                    result.versantScore,
                    result.versantBadge,
                    result.level,
                    result.cefr,
                    result.eligibility,
                    result.wpm,
                    result.sm,
                    result.flu,
                    result.pro,
                    result.voc,
                    result.repeatAccuracy,
                    result.typeWpm,
                    result.typeAccuracy,
                    `${result.correctCount}/5`,
                    result.aoiList.join(" | "),
                    result.finalPassedStatus ? "None" : result.detailedMistakes.map(m => m.title).join(" | ")
                ];

                const csvContent = "data:text/csv;charset=utf-8," 
                    + headers.map(h => `"${h}"`).join(",") + "\n"
                    + dataRow.map(d => `"${String(d).replace(/"/g, '""')}"`).join(",");
                    
                const link = document.createElement("a");
                link.href = encodeURI(csvContent);
                link.download = `${agentName.replace(/\s+/g, '_')}_Versant_Report.csv`;
                document.body.appendChild(link);
                link.click();
            };

            const ProgressBar = ({ label, value, colorClass }) => (
                <div className="mb-3.5">
                    <div className="flex justify-between text-xs mb-1.5 font-semibold">
                        <span className="text-slate-600 uppercase tracking-wide">{label}</span>
                        <span className="text-slate-800">{value} / 80</span>
                    </div>
                    <div className="w-full bg-slate-200/70 rounded-full h-2.5">
                        <div className={`h-2.5 rounded-full ${colorClass} transition-all duration-500`} style={{ width: `${(value/80)*100}%` }}></div>
                    </div>
                </div>
            );

            return (
                <div className="max-w-4xl mx-auto">
                    {/* Header Top - With Logo */}
                    <div className="bg-white border border-slate-200 rounded-2xl shadow-sm p-4 mb-6 flex items-center justify-between">
                        <div className="flex items-center gap-3">
                            <div className="w-12 h-12 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-black text-2xl shadow-lg shadow-indigo-500/25">V</div>
                            <div>
                                <h1 className="text-xl font-extrabold text-slate-900 tracking-tight">AI Versant Diagnostic Portal</h1>
                                <p className="text-xs font-semibold text-slate-500">Automated CEFR Voice & Error Analysis Engine</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-6">
                            {isRecording && (
                                <div className="flex items-center gap-2 px-3 py-1.5 bg-rose-50 border border-rose-200 rounded-full text-rose-600 text-xs font-bold">
                                    <div className="audio-wave"><span></span><span></span><span></span><span></span></div>
                                    MIC ACTIVE
                                </div>
                            )}
                            <img src="logo.png" alt="" className="h-20 w-auto object-contain drop-shadow-sm" />
                        </div>
                    </div>

                    {step === 0 && (
                        <div className="bg-white border border-slate-200 rounded-2xl shadow-sm p-8 sm:p-10">
                            <h2 className="text-2xl font-bold text-slate-900 mb-2">Candidate Verification</h2>
                            <p className="text-slate-500 text-sm mb-8 font-medium">Candidate ka naam enter karein. AI Engine automatically CEFR level (A1 to C2) aur Hiring Eligibility generate karega.</p>
                            <div className="space-y-4 max-w-md mb-8">
                                <div>
                                    <label className="block text-sm font-bold text-slate-700 mb-2">Candidate Full Name *</label>
                                    <input type="text" value={agentName} onChange={(e) => setAgentName(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-600 outline-none"/>
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-slate-700 mb-2">Agent ID (Optional)</label>
                                    <input type="text" value={agentId} onChange={(e) => setAgentId(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-600 outline-none"/>
                                </div>
                            </div>
                            <button onClick={handleStartTest} className="px-8 py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition shadow-lg shadow-indigo-600/25">Start Assessment →</button>
                        </div>
                    )}

                    {step === 1 && (
                        <div className="bg-white border border-slate-200 rounded-2xl shadow-sm p-8 relative">
                            <div className="flex justify-between items-center mb-6 pb-4 border-b border-slate-100">
                                <div>
                                    <span className="text-xs font-extrabold text-indigo-600 uppercase tracking-wider">Part 1 of 4</span>
                                    <h2 className="text-2xl font-bold text-slate-900 mt-1">Reading Fluency Assessment</h2>
                                    <p className="text-xs font-semibold text-slate-500 mt-1">Test will automatically record you after the countdown.</p>
                                </div>
                                <div className="text-center bg-indigo-50 border border-indigo-100 rounded-lg p-3">
                                    <span className="block text-xs font-bold text-indigo-700 uppercase">Starts In</span>
                                    <span className="block text-2xl font-black text-indigo-900">{readingCountdown}s</span>
                                </div>
                            </div>
                            <div className="bg-slate-50 border border-slate-200 rounded-xl p-6 text-lg leading-relaxed whitespace-pre-line mb-6 font-medium text-slate-800">
                                {currentPassage}
                            </div>
                            <div className="flex items-center gap-4 pt-4 border-t border-slate-100">
                                {isRecording && (
                                    <button onClick={stopRecording} className="px-6 py-3 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl transition shadow-md flex items-center gap-2">■ Stop Reading</button>
                                )}
                                {!isRecording && hasRecordedCurrent && (
                                    <button onClick={() => { setStep(2); setHasRecordedCurrent(false); }} className="px-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition shadow-md">Proceed to AI Voice Repeat →</button>
                                )}
                            </div>
                        </div>
                    )}

                    {step === 2 && (
                        <div className="bg-white border border-slate-200 rounded-2xl shadow-sm p-8">
                            <div className="flex justify-between items-center mb-6 pb-4 border-b border-slate-100">
                                <div>
                                    <span className="text-xs font-extrabold text-indigo-600 uppercase tracking-wider">Part 2 of 4</span>
                                    <h2 className="text-2xl font-bold text-slate-900 mt-1">AI Voice Repeat Test</h2>
                                    <p className="text-xs font-semibold text-slate-500 mt-1">Listen to the AI and repeat the sentence exactly.</p>
                                </div>
                            </div>
                            <div className="bg-slate-50 border border-slate-200 rounded-xl p-8 text-center mb-6">
                                <button onClick={playAIVoice} disabled={isRecording} className={`w-16 h-16 rounded-full flex items-center justify-center mx-auto text-2xl shadow-lg transition ${hasPlayedAI ? 'bg-indigo-200 text-indigo-700' : 'bg-indigo-600 text-white hover:bg-indigo-700 hover:scale-105'}`}>
                                    🔊
                                </button>
                                <p className="mt-3 font-bold text-slate-700">{hasPlayedAI ? "Audio Played" : "Click to Listen"}</p>
                            </div>
                            <div className="flex items-center gap-4 pt-4 border-t border-slate-100 justify-center">
                                {hasPlayedAI && !isRecording && !hasRecordedCurrent && (
                                    <button onClick={startRecording} className="px-8 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition shadow-md flex items-center gap-2">🎙️ Start Recording</button>
                                )}
                                {isRecording && (
                                    <button onClick={stopRecording} className="px-8 py-3 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl transition shadow-md flex items-center gap-2">■ Stop Recording</button>
                                )}
                                {!isRecording && hasRecordedCurrent && (
                                    <button onClick={() => { setStep(3); setHasRecordedCurrent(false); }} className="px-8 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition shadow-md">Proceed to Typing Test →</button>
                                )}
                            </div>
                        </div>
                    )}

                    {step === 3 && (
                        <div className="bg-white border border-slate-200 rounded-2xl shadow-sm p-8">
                            <div className="flex justify-between items-center mb-6 pb-4 border-b border-slate-100">
                                <div>
                                    <span className="text-xs font-extrabold text-indigo-600 uppercase tracking-wider">Part 3 of 4</span>
                                    <h2 className="text-2xl font-bold text-slate-900 mt-1">Typing Speed Assessment</h2>
                                    <p className="text-xs font-semibold text-slate-500 mt-1">Type the exact paragraph below within 2 minutes.</p>
                                </div>
                                <div className={`text-center rounded-lg p-3 border ${typingTimeLeft <= 30 ? 'bg-rose-50 border-rose-200 text-rose-700' : 'bg-slate-50 border-slate-200 text-slate-700'}`}>
                                    <span className="block text-xs font-bold uppercase tracking-wider">Time Left</span>
                                    <span className="block text-2xl font-black">{Math.floor(typingTimeLeft / 60)}:{(typingTimeLeft % 60).toString().padStart(2, '0')}</span>
                                </div>
                            </div>
                            
                            <div className="bg-slate-50 border border-slate-200 rounded-xl p-5 text-sm leading-relaxed whitespace-pre-line mb-4 font-medium text-slate-600 select-none">
                                {currentTyping}
                            </div>
                            
                            <textarea 
                                value={typingInput}
                                onChange={(e) => setTypingInput(e.target.value)}
                                className="w-full h-32 p-4 rounded-xl border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none resize-none text-slate-800 font-medium leading-relaxed"
                                placeholder="Start typing here..."
                            ></textarea>

                            <div className="flex justify-end pt-4 mt-4 border-t border-slate-100">
                                <button onClick={() => setStep(4)} className="px-8 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition shadow-md">Submit & Proceed to Logic Test →</button>
                            </div>
                        </div>
                    )}

                    {step === 4 && assignedQuestions.length > 0 && (
                        <div className="bg-white border border-slate-200 rounded-2xl shadow-sm p-8">
                            <div className="flex justify-between items-center mb-6 pb-4 border-b border-slate-100">
                                <div>
                                    <span className="text-xs font-extrabold text-indigo-600 uppercase tracking-wider">Part 4 of 4</span>
                                    <h2 className="text-2xl font-bold text-slate-900 mt-1">Cognitive Logic MCQ Test</h2>
                                </div>
                                <span className="text-sm font-bold bg-slate-100 text-slate-700 px-3 py-1 rounded-lg">Question {currentQIndex + 1} / 5</span>
                            </div>

                            <div className="bg-slate-50 border border-slate-200 rounded-xl p-6 mb-6">
                                <p className="text-2xl font-bold text-slate-900 mb-4">{assignedQuestions[currentQIndex].q}</p>
                                <div className="space-y-3">
                                    {assignedQuestions[currentQIndex].options.map((opt, i) => (
                                        <label key={i} className={`flex items-center gap-3 p-3 rounded-lg border cursor-pointer transition ${selectedOptions[currentQIndex] === i ? 'bg-indigo-50 border-indigo-500' : 'bg-white border-slate-300 hover:bg-slate-50'}`}>
                                            <input type="radio" name={`mcq-${currentQIndex}`} checked={selectedOptions[currentQIndex] === i} onChange={() => handleOptionChange(i)} className="w-5 h-5 text-indigo-600"/>
                                            <span className="text-lg font-medium text-slate-800">{opt}</span>
                                        </label>
                                    ))}
                                </div>
                            </div>
                            <div className="flex items-center gap-4 pt-4 border-t border-slate-100">
                                {currentQIndex < 4 ? (
                                    <button onClick={() => setCurrentQIndex(prev => prev + 1)} disabled={selectedOptions[currentQIndex] === null} className={`px-6 py-3 font-bold rounded-xl transition shadow-md ${selectedOptions[currentQIndex] === null ? 'bg-slate-300 text-slate-500 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-700 text-white'}`}>Next Question →</button>
                                ) : (
                                    <button onClick={calculateEvaluation} disabled={selectedOptions[currentQIndex] === null} className={`px-8 py-3 font-bold rounded-xl transition shadow-md ${selectedOptions[currentQIndex] === null ? 'bg-slate-300 text-slate-500 cursor-not-allowed' : 'bg-slate-900 hover:bg-black text-white'}`}>{isEvaluating ? "Analyzing Versant Logic..." : "Submit & Generate Report"}</button>
                                )}
                            </div>
                        </div>
                    )}

                    {step === 5 && result && (
                        <div className="space-y-6">
                            <div className="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
                                <div className={`px-8 py-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 ${result.finalPassedStatus ? (result.isVoicePassed ? "bg-emerald-600" : "bg-blue-600") : "bg-rose-600"} text-white`}>
                                    <div>
                                        <h2 className="text-3xl font-black">{agentName}</h2>
                                        <p className="text-sm font-medium opacity-90 mt-1">{result.timestamp} • {agentId || "No ID"}</p>
                                    </div>
                                    <div className="text-left sm:text-right">
                                        <div className="text-4xl font-black">{result.versantScore}<span className="text-xl opacity-80">/80</span></div>
                                        <p className="text-xs uppercase font-bold tracking-wider opacity-90">Versant Speaking Score</p>
                                        <div className="flex gap-2 mt-3 justify-start sm:justify-end flex-wrap">
                                            <span className="px-3 py-1 bg-white/20 rounded-full text-xs font-bold uppercase tracking-wider backdrop-blur-sm">
                                                {result.finalPassedStatus ? (result.isVoicePassed ? "✓ VOICE QUALIFIED" : "✓ NON-VOICE QUALIFIED") : "✕ FAILED / DOMESTIC"}
                                            </span>
                                        </div>
                                    </div>
                                </div>

                                <div className="p-8 grid grid-cols-1 md:grid-cols-2 gap-8">
                                    <div>
                                        <h3 className="text-lg font-bold text-slate-900 mb-1">AI Speech Metrics (CEFR Algorithm)</h3>
                                        <p className="text-xs text-slate-500 mb-4 font-semibold">Scale: 10-80</p>
                                        <ProgressBar label={`Sentence Mastery`} value={result.sm} colorClass="bg-indigo-600" />
                                        <ProgressBar label={`Fluency (Pacing)`} value={result.flu} colorClass="bg-blue-600" />
                                        <ProgressBar label={`Pronunciation`} value={result.pro} colorClass="bg-amber-500" />
                                        <ProgressBar label={`Vocabulary`} value={result.voc} colorClass="bg-emerald-600" />
                                        
                                        <div className="mt-5 p-4 border border-slate-200 rounded-xl bg-slate-50 flex items-center justify-between">
                                            <div>
                                                <span className="text-sm font-bold text-slate-700 block">Logic MCQ Score</span>
                                                <span className="text-xs text-slate-500 font-medium">Cognitive Logic Check</span>
                                            </div>
                                            <span className={`px-3 py-1 rounded-full text-xs font-bold ${result.correctCount >= 3 ? "bg-emerald-100 text-emerald-700" : "bg-rose-100 text-rose-700"}`}>
                                                {result.correctCount} / 5 Correct
                                            </span>
                                        </div>

                                        {/* Prominent Display for Test 2 and Test 3 */}
                                        <div className="grid grid-cols-2 gap-4 mt-5">
                                            <div className={`bg-fuchsia-50 border ${result.isRepeatPass ? 'border-emerald-300' : 'border-rose-300'} p-4 rounded-xl shadow-sm relative`}>
                                                <span className={`absolute top-3 right-3 px-2 py-0.5 rounded text-[10px] font-bold tracking-wider ${result.isRepeatPass ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}`}>
                                                    {result.isRepeatPass ? 'PASS' : 'FAIL'}
                                                </span>
                                                <h4 className="text-xs font-bold text-fuchsia-800 uppercase tracking-wider mb-1">Test 2: Repeat Test</h4>
                                                <p className="text-3xl font-black text-fuchsia-600">{result.repeatAccuracy}%</p>
                                                <p className="text-xs font-medium text-fuchsia-700 mt-1">Pronunciation Match</p>
                                            </div>
                                            <div className={`bg-blue-50 border ${result.isTypingPass ? 'border-emerald-300' : 'border-rose-300'} p-4 rounded-xl shadow-sm relative`}>
                                                <span className={`absolute top-3 right-3 px-2 py-0.5 rounded text-[10px] font-bold tracking-wider ${result.isTypingPass ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}`}>
                                                    {result.isTypingPass ? 'PASS' : 'FAIL'}
                                                </span>
                                                <h4 className="text-xs font-bold text-blue-800 uppercase tracking-wider mb-1">Test 3: Typing Test</h4>
                                                <p className="text-3xl font-black text-blue-600">{result.typeWpm} <span className="text-lg">WPM</span></p>
                                                <p className="text-xs font-medium text-blue-700 mt-1">Accuracy: {result.typeAccuracy}%</p>
                                            </div>
                                        </div>
                                    </div>

                                    <div>
                                        <div className="mb-5 p-5 rounded-xl bg-indigo-50 border border-indigo-200 shadow-sm relative overflow-hidden">
                                            <div className="flex justify-between items-start mb-3 relative z-10">
                                                <div>
                                                    <span className="px-2.5 py-0.5 bg-indigo-200 text-indigo-800 text-[10px] font-black uppercase rounded tracking-wider">CEFR: {result.cefr}</span>
                                                    <h4 className="text-xl font-bold text-indigo-900 mt-1.5">{result.level}</h4>
                                                </div>
                                                <div className="w-14 h-14 bg-indigo-600 text-white rounded-full flex items-center justify-center text-2xl font-black shadow-lg">
                                                    {result.versantBadge}
                                                </div>
                                            </div>
                                            <div className="relative z-10 p-3 bg-white/70 rounded-lg text-xs font-semibold text-indigo-800 leading-relaxed border border-indigo-100">
                                                {result.eligibility}
                                            </div>
                                        </div>

                                        <button onClick={downloadExcelCSV} className="w-full py-4 mb-4 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl transition text-sm flex items-center justify-center gap-2 shadow-lg">
                                            📥 Download Official Report (CSV)
                                        </button>
                                    </div>
                                </div>
                            </div>

                            {!result.finalPassedStatus && (
                                <div className="bg-white border-2 border-rose-200 rounded-2xl shadow-sm p-6 sm:p-8">
                                    <div className="flex items-center gap-2 mb-4 pb-3 border-b border-rose-100">
                                        <span className="w-8 h-8 rounded-lg bg-rose-100 text-rose-600 flex items-center justify-center font-bold text-lg">⚠️</span>
                                        <div>
                                            <h3 className="text-lg font-bold text-slate-900">Failure Diagnostics</h3>
                                            <p className="text-xs text-slate-500">Reasons for Domestic routing / Disqualification:</p>
                                        </div>
                                    </div>
                                    <div className="space-y-3">
                                        {result.detailedMistakes.map((item, idx) => (
                                            <div key={idx} className="p-4 rounded-xl bg-rose-50 border border-rose-200">
                                                <p className="text-sm font-bold text-rose-900">{idx + 1}. {item.title}</p>
                                                <p className="text-xs text-rose-700 mt-1 font-medium">{item.desc}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            <div className="bg-white border border-slate-200 rounded-2xl shadow-sm p-6 sm:p-8">
                                <h3 className="text-lg font-bold text-slate-900 mb-6 pb-3 border-b border-slate-100">Test Breakdown Audit</h3>
                                
                                <div className="mb-8 p-4 bg-slate-50 rounded-xl border border-slate-200">
                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-3">
                                        <div>
                                            <p className="text-sm font-bold text-indigo-700">Reading Speed & Pacing</p>
                                            <p className="text-xs text-slate-600 mt-1">Agent Reading Speed: <strong>{result.wpm} Words per minute</strong></p>
                                        </div>
                                        {readingAudioURL && <audio controls src={readingAudioURL} className="h-8 w-full sm:w-64" />}
                                    </div>
                                    {result.missedWordsList && result.missedWordsList.length > 0 && (
                                        <div className="mt-4 pt-4 border-t border-slate-200">
                                            <p className="text-xs font-bold uppercase text-slate-600 mb-2">Missed or Mispronounced Words:</p>
                                            <div className="flex flex-wrap gap-1.5">
                                                {result.missedWordsList.map((word, wIdx) => (
                                                    <span key={wIdx} className="px-2.5 py-1 bg-rose-100 text-rose-800 border border-rose-200 rounded-md text-xs font-bold">{word}</span>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>
                                
                                <div className="mb-8 p-4 bg-slate-50 rounded-xl border border-slate-200">
                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-3">
                                        <div>
                                            <p className="text-sm font-bold text-fuchsia-700">Repeat Pronunciation Audit</p>
                                            <p className="text-xs text-slate-600 mt-1">Match Accuracy: <strong>{result.repeatAccuracy}%</strong></p>
                                        </div>
                                        {repeatAudioURL && <audio controls src={repeatAudioURL} className="h-8 w-full sm:w-64" />}
                                    </div>
                                </div>
                                
                                <div className="space-y-4">
                                    <p className="text-sm font-bold text-indigo-700">5 Logic MCQs Breakdown</p>
                                    {result.breakdown.map((item, idx) => (
                                        <div key={idx} className="p-4 bg-white border border-slate-200 rounded-xl">
                                            <div className="flex justify-between items-center mb-2">
                                                <p className="text-sm font-bold text-slate-800">Q{idx + 1}: {item.question}</p>
                                                <span className={`text-xs font-bold px-2 py-0.5 rounded ${item.isCorrect ? "bg-emerald-100 text-emerald-700" : "bg-rose-100 text-rose-700"}`}>
                                                    {item.isCorrect ? "Correct" : "Incorrect"}
                                                </span>
                                            </div>
                                            <div className="text-xs mt-3 bg-slate-50 p-3 rounded-lg flex flex-col gap-1">
                                                <p><span className="text-slate-500 font-bold">Selected:</span> <span className="font-medium text-slate-800">{item.candidateAnswer}</span></p>
                                                <p><span className="text-slate-500 font-bold">Expected:</span> <span className="font-semibold text-emerald-700">{item.expected}</span></p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            
                            <div className="text-center pb-8">
                                <button onClick={() => window.location.reload()} className="px-6 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold text-sm rounded-xl transition">
                                    ↻ Conduct Test for New Agent
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
