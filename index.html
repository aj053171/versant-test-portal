<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Versant Assessment Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen py-10 px-4 sm:px-6">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // 4-line reading assessment passage
        const READING_PASSAGE = "Welcome to the customer support line. Our technical team is available twenty-four hours a day to diagnose and resolve your internet issues.\nPlease check that the main power adapter is tightly connected to your wireless modem.\nVerify that the network signal light remains solid green and is not blinking red or amber.\nIf the connection drops repeatedly, restart the hardware and wait two minutes before calling back.";

        // Complete question bank for random allocation
        const MASTER_QUESTION_POOL = [
            { q: "Which is faster: a bicycle or a jet plane?", answers: ["jet plane", "plane", "jet", "aeroplane"] },
            { q: "Should you use a hammer or a key to open a locked wooden door?", answers: ["key"] },
            { q: "To keep ice cream cold, should you put it in the oven or the freezer?", answers: ["freezer"] },
            { q: "If a shirt is too big, is it tight or loose?", answers: ["loose"] },
            { q: "Which is heavier: a pillow or a brick?", answers: ["brick"] },
            { q: "Does a standard traffic light use red or blue to tell drivers to stop?", answers: ["red"] },
            { q: "If you want to cut a piece of paper, would you use scissors or a pen?", answers: ["scissors", "scissor"] },
            { q: "What is the opposite of the word 'heavy'?", answers: ["light"] },
            { q: "If you are not awake, what are you?", answers: ["asleep", "sleeping", "sleep"] },
            { q: "Is your father's sister your aunt or your uncle?", answers: ["aunt", "aunty"] },
            { q: "What do we call a person who treats sick animals?", answers: ["vet", "veterinarian", "veterinary doctor"] },
            { q: "If today is Tuesday, what day was yesterday?", answers: ["monday"] },
            { q: "Is a newborn human baby called an adult or an infant?", answers: ["infant", "baby"] },
            { q: "How many months are there in a single year?", answers: ["12", "twelve"] },
            { q: "Which season comes directly after winter?", answers: ["spring"] },
            { q: "Are clouds found in the sky or under the ground?", answers: ["sky", "in the sky"] },
            { q: "What liquid falls from the sky when it rains?", answers: ["water", "rainwater", "rain"] },
            { q: "How many wheels does a standard motorcycle have?", answers: ["2", "two"] },
            { q: "Which is larger: an ocean or a swimming pool?", answers: ["ocean", "an ocean"] },
            { q: "What part of a tree grows underground: the leaves or the roots?", answers: ["roots", "root"] }
        ];

        // Fisher-Yates shuffle algorithm to guarantee true random picking
        function getRandomQuestions(pool, count = 5) {
            const arr = [...pool];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr.slice(0, count);
        }

        function App() {
            const [agentName, setAgentName] = useState("");
            const [agentId, setAgentId] = useState("");
            const [step, setStep] = useState(0); 

            // Selected questions for this specific agent
            const [assignedQuestions, setAssignedQuestions] = useState([]);
            const [currentQIndex, setCurrentQIndex] = useState(0);

            // Audio & speech state
            const [isRecording, setIsRecording] = useState(false);
            const [readingTranscript, setReadingTranscript] = useState("");
            const [readingAudioURL, setReadingAudioURL] = useState(null);

            const [qaTranscripts, setQaTranscripts] = useState([]);
            const [qaAudioURLs, setQaAudioURLs] = useState([]);
            const [hasRecordedCurrent, setHasRecordedCurrent] = useState(false);

            // Final evaluation result
            const [result, setResult] = useState(null);
            const [isEvaluating, setIsEvaluating] = useState(false);

            const mediaRecorder = useRef(null);
            const audioChunks = useRef([]);
            const recognition = useRef(null);

            // Setup speech recognition
            useEffect(() => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognition) {
                    recognition.current = new SpeechRecognition();
                    recognition.current.continuous = true;
                    recognition.current.interimResults = true;

                    recognition.current.onresult = (event) => {
                        let text = '';
                        for (let i = event.resultIndex; i < event.results.length; ++i) {
                            if (event.results[i].isFinal) {
                                text += event.results[i][0].transcript + ' ';
                            }
                        }
                        if (step === 1) {
                            setReadingTranscript(prev => prev + text);
                        } else if (step === 2) {
                            setQaTranscripts(prev => {
                                const next = [...prev];
                                next[currentQIndex] = (next[currentQIndex] || "") + text;
                                return next;
                            });
                        }
                    };
                }
            }, [step, currentQIndex]);

            // Start test: assign completely randomized questions to this agent
            const handleStartTest = () => {
                if (!agentName.trim()) {
                    alert("Kripya candidate ka naam enter karein.");
                    return;
                }
                const randomFive = getRandomQuestions(MASTER_QUESTION_POOL, 5);
                setAssignedQuestions(randomFive);
                setQaTranscripts(new Array(5).fill(""));
                setQaAudioURLs(new Array(5).fill(null));
                setCurrentQIndex(0);
                setReadingTranscript("");
                setReadingAudioURL(null);
                setHasRecordedCurrent(false);
                setStep(1);
            };

            const startRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder.current = new MediaRecorder(stream);
                    audioChunks.current = [];

                    mediaRecorder.current.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunks.current.push(e.data);
                    };

                    mediaRecorder.current.onstop = () => {
                        const audioBlob = new Blob(audioChunks.current, { type: 'audio/webm' });
                        const audioUrl = URL.createObjectURL(audioBlob);
                        if (step === 1) {
                            setReadingAudioURL(audioUrl);
                        } else if (step === 2) {
                            setQaAudioURLs(prev => {
                                const copy = [...prev];
                                copy[currentQIndex] = audioUrl;
                                return copy;
                            });
                        }
                    };

                    mediaRecorder.current.start();
                    if (recognition.current) {
                        try { recognition.current.start(); } catch (err) {}
                    }
                    setIsRecording(true);
                } catch (err) {
                    alert("Microphone permission required! Kripya mic access allow karein.");
                }
            };

            const stopRecording = () => {
                if (mediaRecorder.current && mediaRecorder.current.state !== "inactive") {
                    mediaRecorder.current.stop();
                }
                if (recognition.current) {
                    try { recognition.current.stop(); } catch (e) {}
                }
                setIsRecording(false);
                setHasRecordedCurrent(true);
            };

            // Evaluate locally without external API key
            const calculateEvaluation = () => {
                setIsEvaluating(true);
                setTimeout(() => {
                    // 1. Reading passage evaluation
                    const expectedWords = READING_PASSAGE.toLowerCase().replace(/[^a-zA-Z0-9\s]/g, '').split(/\s+/).filter(Boolean);
                    const spokenWords = readingTranscript.toLowerCase().replace(/[^a-zA-Z0-9\s]/g, '').split(/\s+/).filter(Boolean);
                    
                    let matchedCount = 0;
                    expectedWords.forEach(w => {
                        if (spokenWords.includes(w)) matchedCount++;
                    });

                    const readingAccuracy = expectedWords.length > 0 ? Math.round((matchedCount / expectedWords.length) * 100) : 0;
                    const pronunciation = Math.min(96, Math.max(35, Math.round(readingAccuracy * 0.85 + 10)));
                    const fluency = Math.min(95, Math.max(30, Math.round(readingAccuracy * 0.75 + (spokenWords.length > 10 ? 20 : 5))));

                    // 2. Questions verification
                    let correctCount = 0;
                    const breakdown = assignedQuestions.map((item, idx) => {
                        const rawAns = (qaTranscripts[idx] || "").toLowerCase().trim();
                        const isMatch = item.answers.some(ans => rawAns.includes(ans.toLowerCase()));
                        if (isMatch) correctCount++;
                        return {
                            question: item.q,
                            candidateAnswer: rawAns || "(No speech detected)",
                            isCorrect: isMatch,
                            expected: item.answers.join(" / "),
                            audio: qaAudioURLs[idx]
                        };
                    });

                    const logicScore = Math.round((correctCount / 5) * 100);
                    const vocabulary = Math.min(98, Math.max(40, Math.round(logicScore * 0.65 + readingAccuracy * 0.35)));
                    const overallScore = Math.round((pronunciation * 0.3) + (fluency * 0.25) + (logicScore * 0.3) + (vocabulary * 0.15));

                    let level = "V1 (Pre-Elementary)";
                    if (overallScore >= 85) level = "V6 (Native Mastery)";
                    else if (overallScore >= 75) level = "V5 (Advanced Business)";
                    else if (overallScore >= 65) level = "V4 (Proficient)";
                    else if (overallScore >= 55) level = "V3 (Intermediate)";
                    else if (overallScore >= 45) level = "V2 (Basic)";

                    const isPassed = overallScore >= 60 && correctCount >= 3;
                    const failureReasons = [];
                    if (!isPassed) {
                        if (correctCount < 3) failureReasons.push(`Logical questions accuracy low: 5 me se sirf ${correctCount} sawal sahi the.`);
                        if (readingAccuracy < 55) failureReasons.push(`Reading accuracy kam thi (${readingAccuracy}%). Pronunciation aur clear speech par dhyan dein.`);
                        if (fluency < 55) failureReasons.push("Speech me pauses aur hesitations zyada detect huye.");
                    }

                    setResult({
                        isPassed,
                        overallScore,
                        level,
                        pronunciation,
                        fluency,
                        logicScore,
                        vocabulary,
                        readingAccuracy,
                        correctCount,
                        failureReasons,
                        breakdown,
                        timestamp: new Date().toLocaleString()
                    });

                    setStep(3);
                    setIsEvaluating(false);
                }, 750);
            };

            const downloadCSV = () => {
                const rows = [
                    ["Candidate Name", agentName],
                    ["Candidate ID", agentId || "N/A"],
                    ["Test Date", result.timestamp],
                    ["Status", result.isPassed ? "PASSED" : "FAILED"],
                    ["Overall Score", `${result.overallScore} / 100`],
                    ["Versant Grade", result.level],
                    ["Pronunciation", `${result.pronunciation}%`],
                    ["Fluency", `${result.fluency}%`],
                    ["Logic Score", `${result.logicScore}% (${result.correctCount}/5 Correct)`],
                    ["Reading Fidelity", `${result.readingAccuracy}%`],
                    ["Reason Summary", result.isPassed ? "Qualified assessment standards." : result.failureReasons.join(" | ")]
                ];

                const csvContent = "data:text/csv;charset=utf-8," + rows.map(r => r.map(c => `"${c}"`).join(",")).join("\n");
                const link = document.createElement("a");
                link.href = encodeURI(csvContent);
                link.download = `${agentName.replace(/\s+/g, '_')}_Versant_Scorecard.csv`;
                document.body.appendChild(link);
                link.click();
            };

            return (
                <div className="max-w-4xl mx-auto">
                    {/* Header bar */}
                    <div className="bg-white border border-slate-200 rounded-2xl shadow-sm p-6 mb-6 flex items-center justify-between">
                        <div className="flex items-center gap-3">
                            <div className="w-11 h-11 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-black text-2xl shadow-md shadow-indigo-500/25">V</div>
                            <div>
                                <h1 className="text-xl font-bold text-slate-900 tracking-tight">Versant Spoken & Logic Portal</h1>
                                <p className="text-xs text-slate-500">Automated Randomized Voice Evaluation Engine</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-2 px-3 py-1 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-full text-xs font-semibold">
                            <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                            Random Questions Ready
                        </div>
                    </div>

                    {/* Step 0: Onboarding */}
                    {step === 0 && (
                        <div className="bg-white border border-slate-200 rounded-2xl shadow-sm p-8 sm:p-10">
                            <h2 className="text-2xl font-bold text-slate-900 mb-2">New Candidate Assessment</h2>
                            <p className="text-slate-600 text-sm mb-6">Har agent ko system question pool me se 5 alag sawal randomly assign karega.</p>

                            <div className="space-y-4 max-w-md mb-8">
                                <div>
                                    <label className="block text-sm font-semibold text-slate-700 mb-1.5">Agent / Candidate Name *</label>
                                    <input 
                                        type="text" 
                                        value={agentName} 
                                        onChange={(e) => setAgentName(e.target.value)} 
                                        placeholder="e.g. Ramesh Kumar" 
                                        className="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-600 focus:border-indigo-600 outline-none"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-semibold text-slate-700 mb-1.5">Agent ID (Optional)</label>
                                    <input 
                                        type="text" 
                                        value={agentId} 
                                        onChange={(e) => setAgentId(e.target.value)} 
                                        placeholder="e.g. AGT-1044" 
                                        className="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-600 focus:border-indigo-600 outline-none"
                                    />
                                </div>
                            </div>

                            <button 
                                onClick={handleStartTest} 
                                className="px-8 py-3 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-semibold rounded-xl transition shadow-lg shadow-indigo-600/25"
                            >
                                Start Assessment →
                            </button>
                        </div>
                    )}

                    {/* Step 1: 4-Line Reading */}
                    {step === 1 && (
                        <div className="bg-white border border-slate-200 rounded-2xl shadow-sm p-8">
                            <div className="flex items-center justify-between pb-4 mb-4 border-b border-slate-100">
                                <div>
                                    <span className="text-xs font-bold text-indigo-600 uppercase tracking-wider">Part 1 of 2</span>
                                    <h2 className="text-xl font-bold text-slate-900">4-Line Reading Assessment</h2>
                                </div>
                                <span className="text-xs font-medium bg-slate-100 text-slate-600 px-3 py-1 rounded-full">Agent: {agentName}</span>
                            </div>

                            <p className="text-sm text-slate-600 mb-4"><strong>Start Recording</strong> dabayein, niche diye gaye 4 lines ko saaf aawaz me padhein, aur fir <strong>Stop</strong> karein.</p>

                            <div className="bg-indigo-50/40 border-l-4 border-indigo-600 border border-slate-200 rounded-xl p-6 text-slate-800 text-lg leading-relaxed whitespace-pre-line mb-6 select-none font-medium">
                                {READING_PASSAGE}
                            </div>

                            {readingTranscript && (
                                <div className="mb-6 bg-slate-50 border border-slate-200 rounded-xl p-4">
                                    <p className="text-xs font-bold uppercase text-slate-500 mb-1">Live Captured Speech:</p>
                                    <p className="text-sm text-slate-700 italic">"{readingTranscript}"</p>
                                </div>
                            )}

                            <div className="flex items-center gap-4">
                                {!isRecording && !hasRecordedCurrent && (
                                    <button 
                                        onClick={startRecording} 
                                        className="px-6 py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-semibold rounded-xl transition shadow-md shadow-rose-600/20 flex items-center gap-2"
                                    >
                                        <span className="w-2.5 h-2.5 rounded-full bg-white animate-pulse"></span> Start Reading
                                    </button>
                                )}
                                {isRecording && (
                                    <button 
                                        onClick={stopRecording} 
                                        className="px-6 py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-semibold rounded-xl transition"
                                    >
                                        ■ Stop Reading
                                    </button>
                                )}
                                {!isRecording && hasRecordedCurrent && (
                                    <button 
                                        onClick={() => { setStep(2); setHasRecordedCurrent(false); }} 
                                        className="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl transition shadow-md shadow-indigo-600/20"
                                    >
                                        Proceed to Logic Questions →
                                    </button>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Step 2: 5 Randomized Logic Questions */}
                    {step === 2 && assignedQuestions.length > 0 && (
                        <div className="bg-white border border-slate-200 rounded-2xl shadow-sm p-8">
                            <div className="flex items-center justify-between pb-4 mb-4 border-b border-slate-100">
                                <div>
                                    <span className="text-xs font-bold text-indigo-600 uppercase tracking-wider">Part 2 of 2: Everyday Logic</span>
                                    <h2 className="text-xl font-bold text-slate-900">Question {currentQIndex + 1} of 5</h2>
                                </div>
                                <span className="text-xs font-semibold bg-slate-100 text-slate-700 px-3 py-1 rounded-lg">
                                    {currentQIndex + 1} / 5
                                </span>
                            </div>

                            <div className="bg-slate-50 border border-slate-200 rounded-xl p-6 mb-6">
                                <span className="text-xs font-bold uppercase tracking-wider text-indigo-600">Question for this agent:</span>
                                <p className="text-2xl font-bold text-slate-900 mt-2">{assignedQuestions[currentQIndex].q}</p>
                            </div>

                            <div className="bg-slate-50 border border-slate-200 rounded-xl p-4 mb-6">
                                <span className="text-xs font-bold uppercase text-slate-500">Live Answer Captured:</span>
                                <p className="text-base text-slate-800 mt-1 italic font-medium">
                                    {qaTranscripts[currentQIndex] ? `"${qaTranscripts[currentQIndex]}"` : "(Click record answer and speak clearly)"}
                                </p>
                            </div>

                            <div className="flex items-center gap-4">
                                {!isRecording && !hasRecordedCurrent && (
                                    <button 
                                        onClick={startRecording} 
                                        className="px-6 py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-semibold rounded-xl transition shadow-md shadow-rose-600/20 flex items-center gap-2"
                                    >
                                        <span className="w-2.5 h-2.5 rounded-full bg-white animate-pulse"></span> Record Answer
                                    </button>
                                )}
                                {isRecording && (
                                    <button 
                                        onClick={stopRecording} 
                                        className="px-6 py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-semibold rounded-xl transition"
                                    >
                                        ■ Stop Recording
                                    </button>
                                )}
                                {!isRecording && hasRecordedCurrent && currentQIndex < 4 && (
                                    <button 
                                        onClick={() => { setCurrentQIndex(prev => prev + 1); setHasRecordedCurrent(false); }} 
                                        className="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl transition shadow-md shadow-indigo-600/20"
                                    >
                                        Next Question →
                                    </button>
                                )}
                                {!isRecording && hasRecordedCurrent && currentQIndex === 4 && (
                                    <button 
                                        onClick={calculateEvaluation} 
                                        className="px-8 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition shadow-md shadow-emerald-600/25"
                                    >
                                        {isEvaluating ? "Analyzing Answers..." : "Submit & Generate Report"}
                                    </button>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Step 3: Result Dashboard */}
                    {step === 3 && result && (
                        <div className="space-y-6">
                            {/* Candidate Summary Card */}
                            <div className="bg-white border border-slate-200 rounded-2xl shadow-sm p-6 sm:p-8">
                                <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 pb-6 border-b border-slate-100">
                                    <div>
                                        <div className="flex items-center gap-2.5">
                                            <h2 className="text-2xl font-black text-slate-900">{agentName}</h2>
                                            {agentId && <span className="text-xs bg-slate-100 text-slate-600 px-2.5 py-0.5 rounded font-mono font-medium">{agentId}</span>}
                                        </div>
                                        <p className="text-xs text-slate-500 mt-1">Evaluated On: {result.timestamp}</p>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <span className={`px-4 py-1.5 rounded-full text-sm font-bold tracking-wide uppercase ${result.isPassed ? "bg-emerald-100 text-emerald-800 border border-emerald-200" : "bg-rose-100 text-rose-800 border border-rose-200"}`}>
                                            {result.isPassed ? "✓ PASSED" : "✕ FAILED"}
                                        </span>
                                        <button 
                                            onClick={downloadCSV} 
                                            className="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold rounded-xl transition shadow"
                                        >
                                            Export CSV
                                        </button>
                                    </div>
                                </div>

                                {/* Score Highlights */}
                                <div className="grid grid-cols-2 md:grid-cols-5 gap-4 mt-6">
                                    <div className="p-4 rounded-xl bg-indigo-50/70 border border-indigo-100 text-center">
                                        <p className="text-xs font-bold text-indigo-700 uppercase">Overall Versant</p>
                                        <p className="text-3xl font-black text-indigo-950 mt-1">{result.overallScore}<span className="text-sm font-normal text-indigo-600">/100</span></p>
                                        <p className="text-xs font-semibold text-indigo-800 mt-1">{result.level.split(' ')[0]}</p>
                                    </div>
                                    <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 text-center">
                                        <p className="text-xs font-bold text-slate-500 uppercase">Pronunciation</p>
                                        <p className="text-3xl font-bold text-slate-800 mt-1">{result.pronunciation}%</p>
                                        <p className="text-xs text-slate-500 mt-1">Acoustic Clarity</p>
                                    </div>
                                    <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 text-center">
                                        <p className="text-xs font-bold text-slate-500 uppercase">Fluency</p>
                                        <p className="text-3xl font-bold text-slate-800 mt-1">{result.fluency}%</p>
                                        <p className="text-xs text-slate-500 mt-1">Flow & Cadence</p>
                                    </div>
                                    <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 text-center">
                                        <p className="text-xs font-bold text-slate-500 uppercase">Logic Answers</p>
                                        <p className="text-3xl font-bold text-slate-800 mt-1">{result.correctCount}/5</p>
                                        <p className="text-xs text-slate-500 mt-1">{result.logicScore}% Accuracy</p>
                                    </div>
                                    <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 text-center col-span-2 md:col-span-1">
                                        <p className="text-xs font-bold text-slate-500 uppercase">Vocabulary</p>
                                        <p className="text-3xl font-bold text-slate-800 mt-1">{result.vocabulary}%</p>
                                        <p className="text-xs text-slate-500 mt-1">Comprehension</p>
                                    </div>
                                </div>

                                {/* Failure reason block */}
                                {!result.isPassed ? (
                                    <div className="mt-6 p-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-900">
                                        <p className="text-sm font-bold flex items-center gap-2 mb-1.5 text-rose-950">
                                            <span>⚠️</span> Assessment Failure Diagnosed Reasons:
                                        </p>
                                        <ul className="text-xs space-y-1 list-disc list-inside text-rose-800 font-medium">
                                            {result.failureReasons.map((reason, idx) => (
                                                <li key={idx}>{reason}</li>
                                            ))}
                                        </ul>
                                    </div>
                                ) : (
                                    <div className="mt-6 p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-900 text-xs font-medium">
                                        Candidate cleared all minimum benchmarks. Reading fidelity was {result.readingAccuracy}% and {result.correctCount}/5 logic questions were answered accurately.
                                    </div>
                                )}
                            </div>

                            {/* Section: Live Audios & Breakdown */}
                            <div className="bg-white border border-slate-200 rounded-2xl shadow-sm p-6 sm:p-8">
                                <h3 className="text-lg font-bold text-slate-900 mb-4 pb-2 border-b border-slate-100">
                                    Individual Audio Playback & Answer Verification
                                </h3>

                                {/* Part 1 Audio */}
                                <div className="mb-6 p-4 rounded-xl bg-slate-50 border border-slate-200">
                                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-2">
                                        <div>
                                            <p className="text-xs font-bold uppercase text-indigo-700">Part 1: 4-Line Reading Audio</p>
                                            <p className="text-xs text-slate-500">Text Match Fidelity: {result.readingAccuracy}%</p>
                                        </div>
                                        {readingAudioURL && (
                                            <audio controls src={readingAudioURL} className="h-9 w-full sm:w-64" />
                                        )}
                                    </div>
                                    <p className="text-xs text-slate-600 bg-white p-3 rounded border border-slate-200 italic">
                                        "{readingTranscript || "No voice captured"}"
                                    </p>
                                </div>

                                {/* Part 2 Audios for 5 Unique Questions */}
                                <div className="space-y-3">
                                    <p className="text-xs font-bold uppercase text-slate-500 tracking-wider">Part 2: 5 Random Questions & Answers</p>

                                    {result.breakdown.map((item, idx) => (
                                        <div key={idx} className="p-4 rounded-xl border border-slate-200 bg-white hover:border-slate-300 transition">
                                            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-2">
                                                <div className="flex items-center gap-2">
                                                    <span className={`w-5 h-5 rounded-full flex items-center justify-center text-xs font-bold text-white ${item.isCorrect ? "bg-emerald-500" : "bg-rose-500"}`}>
                                                        {item.isCorrect ? "✓" : "✕"}
                                                    </span>
                                                    <p className="text-sm font-bold text-slate-800">Q{idx + 1}: {item.question}</p>
                                                </div>
                                                <span className={`text-xs font-semibold px-2 py-0.5 rounded self-start sm:self-auto ${item.isCorrect ? "bg-emerald-50 text-emerald-700 border border-emerald-200" : "bg-rose-50 text-rose-700 border border-rose-200"}`}>
                                                    {item.isCorrect ? "Correct" : "Incorrect"}
                                                </span>
                                            </div>

                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs mb-3 bg-slate-50 p-2.5 rounded-lg border border-slate-100">
                                                <div>
                                                    <span className="text-slate-400 font-semibold">Agent Said:</span>
                                                    <p className="text-slate-700 font-medium italic">"{item.candidateAnswer}"</p>
                                                </div>
                                                <div>
                                                    <span className="text-slate-400 font-semibold">Expected Answer:</span>
                                                    <p className="text-slate-700 font-medium">{item.expected}</p>
                                                </div>
                                            </div>

                                            {item.audio && (
                                                <div className="flex items-center justify-between pt-1">
                                                    <span className="text-xs text-slate-400 font-medium">Listen Answer Recording:</span>
                                                    <audio controls src={item.audio} className="h-8 w-full sm:w-60" />
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Reset Button for Next Candidate */}
                            <div className="text-center pb-8">
                                <button 
                                    onClick={() => {
                                        setStep(0);
                                        setAgentName("");
                                        setAgentId("");
                                        setReadingTranscript("");
                                        setReadingAudioURL(null);
                                        setResult(null);
                                        setAssignedQuestions([]);
                                    }} 
                                    className="px-6 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold rounded-xl text-sm transition"
                                >
                                    ← Conduct Next Agent Assessment
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
